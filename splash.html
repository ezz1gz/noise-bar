<script>
(()=>{const ph=document.getElementById('ph');
const fit=()=>{const k=Math.min(innerWidth/393,innerHeight/852*1.08);ph.style.transform=`translateX(-50%) scale(${innerWidth/393})`;};fit();addEventListener('resize',fit);
fetch('assets/splash-glass.svgfrag').then(r=>r.text()).then(t=>document.getElementById('glass').innerHTML=t);
// ── 잔 속 액체: 잔 그릇(Union) 안에서 둥둥 떠다니는 메타볼 (믹스 때 떨어진 액체처럼)
const BOWL=new Path2D('M197.19 161.26C185.801 173.351 166.58 173.351 155.19 161.26L15.9978 13.4917L336.383 13.4917L197.19 161.26Z');
const cv=document.getElementById('liq'),dpr=Math.min(3,devicePixelRatio||1),CW=352.842,CH=200;cv.width=CW*dpr;cv.height=CH*dpr;const x=cv.getContext('2d');
const COLS=['#ff2294','#4583ff','#9b5cff','#ff7a3d','#ff58c8'];
const BL=Array.from({length:9},(_,i)=>({c:COLS[i%COLS.length],x:60+Math.random()*230,y:40+Math.random()*90,r:34+Math.random()*30,ph:Math.random()*6.28,sp:.4+Math.random()*.5}));
let SURF=36;  // 액체 윗면(잔 좌표)
function liquid(t){x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,CW,CH);x.save();x.clip(BOWL);
  const w=Math.sin(t*1.3)*2.2;x.beginPath();x.moveTo(0,SURF+w);for(let i=0;i<=24;i++){const X=i/24*CW;x.lineTo(X,SURF+Math.sin(t*1.6+i*.55)*2.4+w*(i/24-.5));}x.lineTo(CW,CH);x.lineTo(0,CH);x.closePath();x.clip();
  x.fillStyle='#c9a4ff';x.fillRect(0,0,CW,CH);x.filter='blur(16px)';
  BL.forEach(b=>{const bx=b.x+Math.sin(t*b.sp+b.ph)*26,by=b.y+Math.cos(t*b.sp*.8+b.ph)*14;const g=x.createRadialGradient(bx,by,0,bx,by,b.r);g.addColorStop(0,b.c);g.addColorStop(1,b.c+'00');x.fillStyle=g;x.beginPath();x.arc(bx,by,b.r,0,7);x.fill();});
  x.filter='none';const hl=x.createLinearGradient(0,SURF,0,SURF+30);hl.addColorStop(0,'rgba(255,255,255,.55)');hl.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=hl;x.fillRect(0,SURF-4,CW,34);x.restore();}
// ── 가니쉬: 화면 위엔 두 겹(피그마 1줄), 잔에 들어가면 단색 fill(피그마 3줄)
const VB={melt:['302 24 72 72','295 232 72 72'],blossom:['201.5 22 72 72','204.5 231.8 72 72'],spark:['117.5 29 72 72','119.5 229 72 72'],fizz:['18 28.5 72 72','20 234.5 72 72']};
let GF='';fetch('assets/splash-garnish.svgfrag').then(r=>r.text()).then(t=>GF=t);
const G=[];let started=false,t0=performance.now();
const GX=13.6,GY=563.9; // 잔 위치(화면)
function inBowlX(px){const lx=px-GX;return lx>40&&lx<312;}
function drop(){const ks=Object.keys(VB);const n=7+Math.floor(Math.random()*3);
  for(let i=0;i<n;i++){const k=ks[Math.floor(Math.random()*4)],s=34+Math.random()*64,el=document.createElement('div');el.className='gn '+(Math.random()<.5?'front':'back');el.style.width=el.style.height=s+'px';
   el.innerHTML=`<svg viewBox="${VB[k][0]}">${GF}</svg>`;ph.appendChild(el);
   const px=20+Math.random()*353,into=inBowlX(px)&&Math.random()<.75;
   G.push({el,k,s,x:px,y:-s-Math.random()*260,vy:0,rot:(Math.random()-.5)*60,vr:(Math.random()-.5)*2,into,landed:false,ph:Math.random()*6});}}
function landTo(g){const lx=g.x-GX;const half=Math.max(20,(lx<176?lx-15:336-lx)); // 그릇 안쪽 깊이
  return GY+SURF+Math.min(70,half*.35)+g.s*.05;}
function go(){try{sessionStorage.setItem('nbSplash','1');}catch(_){}ph.classList.add('out');setTimeout(()=>location.replace('index.html'+location.search),430);}
function start(){if(started)return;started=true;document.getElementById('hint').classList.remove('on');drop();setTimeout(go,3000);}
ph.addEventListener('pointerdown',start);ph.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')start();});
setTimeout(()=>{if(!started)document.getElementById('hint').classList.add('on');},1600);
let last=performance.now();
(function fr(now){const t=(now-t0)/1000,dt=Math.min(.05,(now-last)/1000);last=now;liquid(t);
  G.forEach(g=>{if(!g.landed){g.vy+=1400*dt;g.y+=g.vy*dt;g.rot+=g.vr;const ly=landTo(g);
     if(g.into&&g.y>=ly){g.landed=true;g.y=ly;g.el.className='gn inside';g.el.innerHTML=`<svg viewBox="${VB[g.k][1]}">${GF}</svg>`;g.el.animate([{scale:'1.15'},{scale:'1'}],{duration:380,easing:'cubic-bezier(.3,1.6,.6,1)'});}}
    else{g.y=landTo(g)+Math.sin(t*1.8+g.ph)*3;g.rot+=Math.sin(t+g.ph)*.15;}
    g.el.style.transform=`translate(${g.x-g.s/2}px,${g.y-g.s/2}px) rotate(${g.rot}deg)`;});
  requestAnimationFrame(fr);})(performance.now());
})();
</script></body></html>
