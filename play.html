float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}

const SIM=`#version 300 es
precision highp float;
uniform sampler2D uPrev;uniform vec2 uSimRes;
uniform float uTime,uDt,uFlow,uScale,uAsp,uRelax,uPtrOn,uPtrR;
uniform vec4 uPtr;
out vec4 o;
${NOISE}
float psi(vec2 q){return fbm(q+vec2(uTime*.05,-uTime*.03));}
void main(){
  vec2 p=gl_FragCoord.xy/uSimRes;

  float a=psi(q+vec2(0,e)),b=psi(q-vec2(0,e)),c=psi(q+vec2(e,0)),d=psi(q-vec2(e,0));
  vec2 v=vec2(a-b,-(c-d))/(2.*e);           // curl noise: 소용돌이만 있는 흐름

}`;

// 액체 입자: Clavet et al.(2005) 이중 밀도 완화 SPH · 잔 안쪽(원뿔) 벽
function makeSim(){
 const A=[34.3047,326.82],B=[172.05,473.054],C=[351.36,326.82],D=[213.614,473.054];
 const nrm=(p,q,s)=>{const dx=q[0]-p[0],dy=q[1]-p[1],l=Math.hypot(dx,dy);return s>0?[dy/l,-dx/l]:[-dy/l,dx/l];};
 const nl=nrm(A,B,1),nr=nrm(C,D,-1);
 const P=[];const H=11,R0=4.2,K=.06,KN=.5,SIG=.12,BET=.1;const S={P,gx:0,gy:.07,TOP:A[1]};const grid=new Map();
 const inL=p=>(p.x-A[0])*nl[0]+(p.y-A[1])*nl[1],inR=p=>(p.x-C[0])*nr[0]+(p.y-C[1])*nr[1];
 S.add=(x,y,vx,vy)=>P.push({x,y,px:x,py:y,vx,vy});
 function build(){grid.clear();P.forEach((p,i)=>{const k=((p.x/H)|0)*1000+((p.y/H+50)|0);let c=grid.get(k);if(!c)grid.set(k,c=[]);c.push(i);});}
 function nb(a,f,ii){const cx=(a.x/H)|0,cy=(a.y/H+50)|0;for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){const c=grid.get((cx+dx)*1000+cy+dy);if(c)for(const j of c){if(ii!==undefined&&j<=ii)continue;if(P[j]!==a)f(P[j]);}}}
 S.step=dt=>{const N=P.length;for(const p of P){p.vx+=S.gx*dt;p.vy+=S.gy*dt;}
  build();for(let i=0;i<N;i++){const a=P[i];nb(a,b=>{const dx=b.x-a.x,dy=b.y-a.y,r=Math.hypot(dx,dy);if(r<1e-4||r>=H)return;const q=r/H,ux=dx/r,uy=dy/r,u=(a.vx-b.vx)*ux+(a.vy-b.vy)*uy;if(u>0){const I=dt*(1-q)*(SIG*u+BET*u*u)*.5;a.vx-=I*ux;a.vy-=I*uy;b.vx+=I*ux;b.vy+=I*uy;}},i);}
  for(const p of P){p.px=p.x;p.py=p.y;p.x+=p.vx*dt;p.y+=p.vy*dt;}
  build();for(let i=0;i<N;i++){const a=P[i];let rho=0,rn=0;const L=[];nb(a,b=>{const dx=b.x-a.x,dy=b.y-a.y,r=Math.hypot(dx,dy);if(r<1e-4||r>=H)return;const q=1-r/H;rho+=q*q;rn+=q*q*q;L.push([b,dx/r,dy/r,q]);});
   const pr=K*(rho-R0),pn=KN*rn;let ax=0,ay=0;for(const[b,ux,uy,q] of L){const D2=dt*dt*(pr*q+pn*q*q)*.5*H*.25;b.x+=D2*ux;b.y+=D2*uy;ax-=D2*ux;ay-=D2*uy;}a.x+=ax;a.y+=ay;}
  for(const p of P){if(p.y>S.TOP-4){let d=inL(p);if(d<1.5){p.x+=(1.5-d)*nl[0];p.y+=(1.5-d)*nl[1];}d=inR(p);if(d<1.5){p.x+=(1.5-d)*nr[0];p.y+=(1.5-d)*nr[1];}if(p.y>478)p.y=478;}
   p.vx=(p.x-p.px)/dt;p.vy=(p.y-p.py)/dt;const v=Math.hypot(p.vx,p.vy);if(v>10){p.vx*=10/v;p.vy*=10/v;}}};
 return S;}

 `precision mediump float;void main(){vec2 d=gl_PointCoord-.5;float r=dot(d,d)*4.;gl_FragColor=vec4(exp(-r*3.2)*step(r,1.)*.32,0.,0.,1.);}`);
const P2=prog(`attribute vec2 a;varying vec2 u;void main(){u=a*.5+.5;gl_Position=vec4(a,0.,1.);}`,
`precision highp float;varying vec2 u;uniform sampler2D uF;uniform float uT;
${FLUID_GLSL}
${MIXTEX_GLSL}
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);vec2 w=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),w.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),w.x),w.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*n(p);p=mat2(.8,.6,-.6,.8)*p*2.;a*=.5;}return v;}
float smin(float a,float b,float k){float hh=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,hh)-k*hh*(1.-hh);}
void main(){vec2 p=vec2(u.x*393.,(1.-u.y)*500.);
  vec2 nl=normalize(vec2(146.234,-137.745)),nr=normalize(vec2(-146.234,-137.745));
  float cone=smin(dot(p-vec2(34.3047,326.82),nl),dot(p-vec2(351.36,326.82),nr),16.);
  float inside=p.y<326.?1.:smoothstep(-.5,1.2,cone);
  float f=texture2D(uF,u).r;float a=smoothstep(.42,.52,f)*inside;if(a<.003){gl_FragColor=vec4(0.);return;}
  vec3 col=drink(vec2(p.x/393.,1.-p.y/560.),vec2(p.x/393.,.18+p.y/852.*.6),uT*.55);
  col=mix(col,vec3(1.),.16*(1.-smoothstep(.52,.75,f)));
  gl_FragColor=vec4(col*a,a);}`);
const fb=gl.createFramebuffer(),ft=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,ft);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,FW,FH,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
[gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T].forEach(k=>gl.texParameteri(gl.TEXTURE_2D,k,gl.CLAMP_TO_EDGE));gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);

if(red){for(let i=0;i<MAX;i++)S.add(150+Math.random()*90,400+Math.random()*70,0,0);for(let k=0;k<400;k++)S.step(1);}
function fr(now){const t=(now-t0)/1000;if(!held&&!useOri)tiltT*=.96;tilt+=(tiltT-tilt)*.12;document.getElementById('gw').style.transform=`translate(8px,357px) scale(1.2) rotate(${tilt}rad)`;if(!document.body.classList.contains('listen')){last=now;requestAnimationFrame(fr);return;}acc+=Math.min(.05,(now-last)/1000);last=now;
  while(acc>1/120){acc-=1/120;const st=t;

// ── 새로 만든 노이즈를 '소리의 바다'(PC 화면)로 보냄 — 같은 믹스는 한 번만
(()=>{try{const Q=new URLSearchParams(location.search);if(!Q.get('g'))return;const key='nb-sent:'+location.search;if(sessionStorage.getItem(key))return;
const d={v:1,id:Math.random().toString(36).slice(2,10)+Date.now().toString(36),t:Date.now(),pk:Q.get('pk'),s:Q.get('s'),lk:Q.get('lk'),lq:Q.get('lq'),lt:Q.get('lt'),g:Q.get('g'),name:Q.get('nm')||undefined,who:Q.get('mk')||undefined};
fetch('https://ntfy.sh/noisebar-sea-k7q2x9m4vz',{method:'POST',body:JSON.stringify(d)}).then(r=>{if(r.ok)try{sessionStorage.setItem(key,'1');sessionStorage.setItem('nb-sea-me',d.id);}catch(_){}}).catch(()=>{});}catch(_){}})();
</script>

<script>
// ── 이름 단계에서 정한 칵테일 이름·닉네임을 플레이 제목 자리에 표시
(()=>{const Q=new URLSearchParams(location.search),nm=Q.get('nm');if(!nm)return;const mk=Q.get('mk')||'';
function put(){if(!document.querySelector('#ph svg'))return setTimeout(put,100);
 document.querySelectorAll('#ph svg path').forEach(p=>{try{const b=p.getBBox();if(b.y>620&&b.y+b.height<688&&b.x>8&&b.x+b.width<250)p.style.display='none';}catch(_){}});
 const d=document.createElement('div');d.id='nbTitle';d.style.cssText='position:absolute;left:17px;top:624px;width:290px;color:#fff;pointer-events:none;z-index:5;font-family:Pretendard,"Apple SD Gothic Neo",system-ui,sans-serif';
 d.innerHTML='<div style="font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div><div style="font-size:16px;opacity:.85;margin-top:4px"></div>';
 d.children[0].textContent=nm;d.children[1].textContent=mk;document.getElementById('ph').appendChild(d);}
if(document.readyState==='loading')addEventListener('DOMContentLoaded',()=>setTimeout(put,50));else setTimeout(put,50);})();
</script></body></html><style id="nb-play-info">

<script>
(()=>{const ply=document.getElementById('ply');if(!ply)return;const Q=new URLSearchParams(location.search);
 const KR={white:'화이트',pink:'핑크',blue:'블루',brown:'브라운'},C={white:'#f4f1ec',pink:'#ff2294',blue:'#4583ff',brown:'#c95f19'};
 const pk=(Q.get('pk')||'white,pink,blue,brown').split(','),sh=(Q.get('s')||'.25,.24,.26,.25').split(',').map(Number),tot=sh.reduce((a,b)=>a+b,0)||1;
 const base=pk.map((k,i)=>`<span><i style="background:${C[k]||'#fff'}"></i>${KR[k]||k} <b>${Math.round(sh[i]/tot*100)}</b></span>`).join('');
 const TH={breath:'숨',flow:'흐름',beat:'박자',scatter:'흩뿌림'};
 const lq=(Q.get('lq')||'').split(',').filter(Boolean).map(x=>{const[t,v]=x.split(':');return (TH[t]||t)+' '+v;});
 const liq=(Q.get('ln')?`<b>${Q.get('ln')}</b> ${Q.get('lv')||''}%`:'')+(lq.length>1?` 외 ${lq.length-1}개 · `+lq.join(' · '):'');
 const gar=(Q.get('g')||'').split(',').filter(Boolean).map(x=>x.split('-')[0].toUpperCase()).filter((v,i,a)=>a.indexOf(v)===i).join(' · ');
 const d=document.createElement('div');d.id='nbInfo';
 d.innerHTML=`<div class="row">BASE&nbsp;${base}</div>`+(liq?`<div class="row">LIQUEUR&nbsp;${liq}</div>`:'')+(gar?`<div class="row">GARNISH&nbsp;${gar}</div>`:'');
 ply.appendChild(d);
 const p=document.createElement('div');p.id='nbPlayIco';p.innerHTML='<svg width="22" height="24" viewBox="0 0 22 24"><path d="M3 2.5v19a1 1 0 0 0 1.5.86l16-9.5a1 1 0 0 0 0-1.72l-16-9.5A1 1 0 0 0 3 2.5z" fill="#fff"/></svg>';ply.appendChild(p);
})();
</script>
