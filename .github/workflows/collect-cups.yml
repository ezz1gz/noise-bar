name: 소리의 바다 기록 모으기
on:
  schedule:
    - cron: '7 * * * *'   # 1시간마다 (ntfy는 12시간만 보관하니 넉넉하게)
  workflow_dispatch:
permissions:
  contents: write
concurrency: collect-cups
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/collect_cups.py
      - name: 새 잔이 있으면 저장
        run: |
          if git diff --quiet -- data/cups.json; then exit 0; fi
          git config user.name "noisebar-bot"
          git config user.email "noisebar-bot@users.noreply.github.com"
          git add data/cups.json
          git commit -m "소리의 바다 기록 모으기"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
