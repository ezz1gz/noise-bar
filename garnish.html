:root{--bg:#e9e9ec}

body{display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:system-ui,sans-serif}

.gl{position:absolute;left:42px;top:263px;width:318px;height:318px;border-radius:50%;overflow:hidden}
.g{position:absolute;left:0;top:0;pointer-events:auto;touch-action:none;cursor:grab;will-change:transform}

.g .bob{position:absolute;inset:0;animation:idle 5s ease-in-out infinite}
@keyframes idle{50%{transform:translate(2px,-4px) rotate(2deg)}}
.g.drag{cursor:grabbing;z-index:5}.g.drag .bob{animation:none;transform:scale(1.08)}
.ing{position:absolute;left:0;top:0;opacity:.6}

.tag{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);font-size:12px;color:#555;background:rgba(255,255,255,.85);padding:6px 12px;border-radius:14px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .3s}

const LOOP=new Set();
function loopG(w,d){const per=({spark:1.6,fizz:2.2,blossom:2.8,melt:2.0})[d.k]*(1+.15*(Math.random()-.5));w._loop={d,per,next:performance.now()/1000+per*.5};LOOP.add(w);}
setInterval(()=>{if(!AC||AC.state!=='running')return;const now=performance.now()/1000;LOOP.forEach(w=>{if(!w.isConnected){LOOP.delete(w);return;}const L=w._loop;if(now>=L.next){L.next=now+L.per;const r=w.getBoundingClientRect(),pr=ph.getBoundingClientRect();playG(L.d,((r.left+r.width/2-pr.left)/pr.width)*2-1);
  w.firstElementChild.animate([{filter:'brightness(1)'},{filter:'brightness(1.6) drop-shadow(0 0 6px rgba(255,255,255,.9))'},{filter:'brightness(1)'}],{duration:420,easing:'ease-out',composite:'add'});}});},40);

function toGlass(el,cx,cy){const d=el._d,s=SIZES[d.sz]*.62;const dx=cx-GC[0],dy=cy-GC[1],r=Math.hypot(dx,dy),lim=GR-s/2-8;
  const k=r>lim?lim/r:1;const gx=GC[0]+dx*k-42,gy=GC[1]+dy*k-263;
  const w=document.createElement('div');w.className='ing';w.style.width=w.style.height=s+'px';w.style.transform=`translate(${gx-s/2}px,${gy-s/2}px)`;
  const id='q'+(UID++),f=FAM[d.k],P=shapePath(d.k,d.n,36-f.off[0]/2,36-f.off[1]/2,d.seed);
  w.innerHTML=`<div class="fl" style="animation-delay:${(-Math.random()*2).toFixed(2)}s"><svg viewBox="0 0 72 72" style="transform:rotate(${d.rot}deg);filter:drop-shadow(0 0 1px rgba(255,255,255,.8))"><defs><filter id="${id}" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation=".6"/></filter></defs><path d="${P}" fill="#D9D9D9" fill-opacity=".2"/><path d="${P}" fill="#fff" fill-opacity=".55" filter="url(#${id})"/></svg></div>`;
  glass.appendChild(w);if(!el._fake)playG(d,(gx/318)*2-1);loopG(w,d);w.animate([{opacity:0,scale:'1.5'},{opacity:.6,scale:'1'}],{duration:500,easing:'cubic-bezier(.45,1.45,.8,1)'});
  while(glass.children.length>3){const o=glass.firstElementChild;o.animate([{opacity:.6},{opacity:0}],{duration:300}).onfinish=()=>o.remove();glass.appendChild(glass.firstElementChild);o.remove();break;}
  tag.textContent=`${f.n} ${d.n} · ${d.sz} 넣었어요`;tag.classList.add('on');clearTimeout(tag._t);tag._t=setTimeout(()=>tag.classList.remove('on'),1400);}
function drag(el){let st=null;const s=()=>SIZES[el._d.sz];
  const pt=e=>{const r=ph.getBoundingClientRect(),k=r.width/393;return[(e.clientX-r.left)/k,(e.clientY-r.top)/k];};
  el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);ac();playG(el._d,(el._x/393)*2-1);const[px,py]=pt(e);st={ox:px-el._x,oy:py-el._y,x0:px,y0:py,moved:false};el.classList.add('drag');});
  el.addEventListener('pointermove',e=>{if(!st)return;const[px,py]=pt(e);if(Math.hypot(px-st.x0,py-st.y0)>5)st.moved=true;place(el,px-st.ox,py-st.oy,s());});
  const end=e=>{if(!st)return;const moved=st.moved;st=null;el.classList.remove('drag');const inG=Math.hypot(el._x-GC[0],el._y-GC[1])<GR;
    if(inG||!moved){const tx=inG?el._x:GC[0]+(Math.random()-.5)*120,ty=inG?el._y:GC[1]+(Math.random()-.5)*120;
      el.style.pointerEvents='none';el.animate([{transform:el.style.transform,opacity:1},{transform:`translate(${tx-s()/2}px,${ty-s()/2}px) scale(.62)`,opacity:.3}],{duration:moved?220:520,easing:'cubic-bezier(.4,0,.6,1)'}).onfinish=()=>{el.remove();toGlass(el,tx,ty);setTimeout(()=>spawn(el._slot,true),260);};}
    else{const sl=SLOTS[el._slot];const back=[el._x,el._y];el.animate([{transform:el.style.transform},{transform:`translate(${sl.x-s()/2}px,${sl.y-s()/2}px)`}],{duration:420,easing:'cubic-bezier(.45,1.45,.8,1)'});place(el,sl.x,sl.y,s());}};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);}
SLOTS.forEach((_,i)=>setTimeout(()=>spawn(i,true),120+i*140));
// 처음 잔 속 하나 (피그마처럼 BLOSSOM)
setTimeout(()=>{const fake={_fake:true,_d:{k:'blossom',n:4,sz:'S',seed:.3,rot:50.63}};toGlass(fake,156,368);tag.classList.remove('on');},50);

(()=>{const cv=document.getElementById('mb');const gl=cv.getContext('webgl',{premultipliedAlpha:true,antialias:true});if(!gl)return;
const VS='attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
const FS=`precision highp float;uniform vec2 uR;uniform float uT;
${FLUID_GLSL}
${MIXTEX_GLSL}
void main(){vec2 p=(gl_FragCoord.xy/uR)*2.-1.;float r=length(p);if(r>1.){gl_FragColor=vec4(0.);return;}
  vec3 col=drink(p*.75+.5,vec2(.5+p.x*.42,.5-p.y*.42*393./852.),uT*.55);float edge=smoothstep(1.,.985,r);gl_FragColor=vec4(col*edge,edge);}`;
const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.log(gl.getShaderInfoLog(o));return o;};
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const la=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(la);gl.vertexAttribPointer(la,2,gl.FLOAT,false,0,0);
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255);
// 피그마 음료 색을 더 쨍하게: 보라 · 마젠타 · 코랄 · 오렌지 · 핑크 · 딥퍼플
setFluid(gl,pr);bindMixTex(gl,pr,3);
const uR=gl.getUniformLocation(pr,'uR'),uT=gl.getUniformLocation(pr,'uT');const red=matchMedia('(prefers-reduced-motion: reduce)').matches;const t0=performance.now();
function fr(){gl.viewport(0,0,cv.width,cv.height);gl.uniform2f(uR,cv.width,cv.height);gl.uniform1f(uT,red?3:(performance.now()-t0)/1000);gl.drawArrays(gl.TRIANGLES,0,3);requestAnimationFrame(fr);}fr();})();

barText();fit();addEventListener('resize',fit);
document.getElementById('bk').onclick=()=>go('glass.html');
document.getElementById('nx').onclick=()=>{const L=[...LOOP].filter(w=>w.isConnected).map(w=>{const d=w._loop.d;return d.k+'-'+d.n+'-'+d.sz;});const q=new URLSearchParams(location.search);q.set('g',L.join(','));location.href='play.html?'+q;};
