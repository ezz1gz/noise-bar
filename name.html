.fld input::placeholder{color:#b7b2bb}
.fld input:focus{border-bottom-color:#000}
.hide{opacity:0;transform:translateY(8px);pointer-events:none}
.st{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .4s}
.st.cur{opacity:1;pointer-events:auto}
#nx{position:absolute;left:317px;top:746px;width:60px;height:60px;border-radius:30px;border:0;background:rgba(0,0,0,.8);display:grid;place-items:center;cursor:pointer;opacity:0;transform:scale(.8);pointer-events:none;transition:opacity .35s,transform .35s cubic-bezier(.3,1.5,.6,1);z-index:5}
#nx.on{opacity:1;transform:none;pointer-events:auto}
#ok{position:absolute;left:0;right:0;top:392px;text-align:center;font-size:12px;color:#8a8590;opacity:0;transition:opacity .3s}
#ph.out{transition:opacity .45s;opacity:0}
.nbspk{display:none!important}

<script src="common.js"></script><script src="mixshaders.js"></script><script src="mixlive.js"></script><script>try{NBMixLive.start();}catch(_){}</script>
<script>
(()=>{const $=id=>document.getElementById(id),ph=$('ph'),Q=new URLSearchParams(location.search);
const fit=()=>{ph.style.transform=`translateX(-50%) scale(${innerWidth/393})`;};fit();addEventListener('resize',fit);
// 위쪽 색 번짐 + 잔 속 액체: 믹스 그림(없으면 고른 색)
let shot=null;try{shot=getMixShot();}catch(_){}
const H={brown:'#C95F19',pink:'#EC4290',white:'#E9E4F4',blue:'#5584F6'},pk=(Q.get('pk')||'pink,blue').split(','),lt=(Q.get('lt')||'').split(',').filter(Boolean).map(h=>'#'+h);
const cols=pk.map(k=>H[k]).filter(Boolean).concat(lt);while(cols.length<3)cols.push(cols[cols.length-1]||'#9b5cff');
if(shot)$('wash').style.backgroundImage=`url("${shot}")`;
else{$('wash').classList.add('fb');$('wash').style.background=`radial-gradient(60% 60% at 30% 40%,${cols[0]},transparent 70%),radial-gradient(60% 60% at 75% 50%,${cols[1]},transparent 70%),radial-gradient(50% 50% at 50% 20%,${cols[2]},transparent 70%)`;}
// 서브에서는 칵테일 잔을 빼고 이름·닉네임 입력만 둠
const clean=s=>s.replace(/[<>]/g,'').replace(/\s+/g,' ').trim();
const nm=$('nm'),mk=$('mk');nm.value=Q.get('nm')||'';try{mk.value=Q.get('mk')||localStorage.getItem('nb-nick')||'';}catch(_){}
let st=0;
function show(n){st=n;['s1','s2','s3'].forEach((id,i)=>$(id).classList.toggle('cur',i+1===n));
  $('s2n').textContent=clean(nm.value);$('s3n').textContent=clean(nm.value);$('s3m').textContent=clean(mk.value);
  $('nx').classList.toggle('on',n===3||(n===1&&clean(nm.value))||(n===2&&clean(mk.value)));
  if(n===1)setTimeout(()=>{nm.focus({preventScroll:true});scrollTo(0,0);},350);if(n===2)setTimeout(()=>{mk.focus({preventScroll:true});scrollTo(0,0);},350);if(n===3)document.activeElement&&document.activeElement.blur();}
nm.oninput=()=>$('nx').classList.toggle('on',!!clean(nm.value));mk.oninput=()=>$('nx').classList.toggle('on',!!clean(mk.value));
const next=()=>{if(st===1){if(!clean(nm.value)){nm.focus();return;}show(2);}else if(st===2){if(!clean(mk.value)){mk.focus();return;}try{localStorage.setItem('nb-nick',clean(mk.value));}catch(_){}show(3);}
  else if(st===3){Q.set('nm',clean(nm.value));Q.set('mk',clean(mk.value));ph.classList.add('out');setTimeout(()=>location.href='play.html?'+Q,450);}};
nm.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();next();}});mk.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();next();}});
$('nx').onclick=next;
$('bk').onclick=()=>{if(st>1){show(st-1);return;}Q.delete('nm');Q.delete('mk');ph.classList.add('out');setTimeout(()=>location.href='garnish.html?'+Q,450);};
$('gVol').onclick=()=>{const L=window.__nbCtxList||[];const off=$('gVol').classList.toggle('off');$('gVol').querySelector('.w').style.opacity=off?0:1;L.forEach(c=>{try{off?c.suspend():c.resume();}catch(_){}});};
// 첫 화면(큰 Serve) → 제목이 위로 작아지며 질문 시작 (다른 단계 설명과 같은 방식)
window.__serveStart=()=>{ph.classList.add('on');show(1);};
})();
</script>
<script src="intro.js"></script>
<script>addEventListener('load',()=>setTimeout(()=>nbIntro({key:'serve',host:document.getElementById('ph'),title:document.getElementById('ttl'),pages:[["서브 Serve","완성된 한 잔에 이름을 붙여요","칵테일 이름과 만든 사람을 적으면 플레이로 이어져요"]],onDone:()=>window.__serveStart()}),250));</script>
