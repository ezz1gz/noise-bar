<style>
/* Layout: an endless pannable field of shared mixes (WebGL metaballs) under floating labels; header on top, tune sheet / detail sheet rise from the bottom */
:root{
  --bg:#fcfbfd;
  --ink:#141117;
  --mute:rgba(20,17,23,.56);
  --faint:rgba(20,17,23,.32);
  --glass:rgba(255,255,255,.66);
  --line:rgba(20,17,23,.08);
  --chip:rgba(20,17,23,.06);
  --accent:#e2468f;
  --f-disp:'Inter','Inter Display','Helvetica Neue',Arial,sans-serif;
  --f-kr:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;
  --f-mono:'Space Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden}
[hidden]{display:none!important}
body{background:#dcd8e0;color:var(--ink);font-family:var(--f-mono);font-size:12px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.app{height:100%;display:flex;flex-direction:column}
.stage{position:relative;flex:1 1 auto;min-height:0;width:100%;overflow:hidden;background:var(--bg);touch-action:none}
/* 조절 패널: 화면을 덮지 않고 옆(넓은 화면) 또는 아래(휴대폰)에 자리 잡음 */
.sheet.tune{flex:none;height:44%;max-height:none;overflow-y:auto;overscroll-behavior:contain;background:#fff;border:0;border-top:1px solid var(--line);border-radius:0;box-shadow:none;animation:none;
  padding:14px max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(18px,env(safe-area-inset-left,0px))}
@media (min-width:640px){
  .app{flex-direction:row;align-items:center;justify-content:center;gap:28px;padding-inline:max(24px,env(safe-area-inset-left,0px)) max(24px,env(safe-area-inset-right,0px))}
  .stage{flex:none;height:min(844px,calc(100% - 48px));width:auto;max-width:calc(100% - 360px);aspect-ratio:390/844;border-radius:40px;box-shadow:0 30px 80px rgba(40,20,50,.25)}
  .sheet.tune{width:320px;height:min(844px,calc(100% - 48px));border:1px solid var(--line);border-radius:30px;padding:20px 22px;box-shadow:0 20px 50px rgba(40,20,50,.12)}
}
@media (max-width:639px){.tuning #sortbar,.tuning .save.quick{display:none!important}}
@media (min-width:640px) and (max-width:759px){.sheet.tune{width:280px}.stage{max-width:calc(100% - 320px)}}
canvas#gl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
canvas#gl:active{cursor:grabbing}

.head{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 18px) max(20px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px))}
.head > *{pointer-events:auto}
.logo{font-family:var(--f-disp);font-weight:900;font-style:italic;font-size:46px;letter-spacing:-.03em;line-height:.9}
.sub{font-family:var(--f-kr);font-size:10px;color:var(--mute);margin-top:9px;letter-spacing:.02em}
.sub b{font-family:var(--f-mono);font-weight:400;color:var(--ink)}
.hbtns{display:flex;gap:8px}
.ic{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.ic.txt{font-family:var(--f-disp);font-style:italic;font-weight:900;font-size:15px;letter-spacing:-.02em}
.ic.txt[aria-pressed="false"]{text-decoration:line-through;color:var(--mute)}
.clean .labels,.clean .logo,.clean .sub,.clean .rings,.clean #sortbar{opacity:0!important;pointer-events:none}
.logo,.sub,.labels,#sortbar{transition:opacity .3s}
.save.quick{display:none;margin:0 4px;height:56px;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line)}
.clean .save.quick{display:flex}
.clean #sortbar{display:none}
.ic[aria-expanded="true"],.ic.dark{background:var(--ink);color:#fff;border-color:var(--ink)}

/* labels */
.labels{position:absolute;inset:0;pointer-events:none;z-index:5}
.m{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;transition:opacity .25s;will-change:transform}
.m .row{display:flex;align-items:center;gap:7px}
.m .dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 0 2.5px rgba(255,255,255,.8)}
.m .tag{font-family:var(--f-kr);font-size:9px;letter-spacing:.06em;color:var(--mute);white-space:nowrap}
.m .name{font-family:var(--f-disp);font-weight:900;font-style:italic;font-size:23px;letter-spacing:-.03em;line-height:1;margin-top:4px;white-space:nowrap}
.m .by{font-size:9px;color:var(--mute);margin-top:4px;white-space:nowrap}
.m .name,.m .by{padding-left:16px}
.m.r{text-align:right}.m.r .row{flex-direction:row-reverse}.m.r .name,.m.r .by{padding:0 16px 0 0}
.focus .m:not(.on){opacity:.22}
.hide-labels .m{opacity:0!important;pointer-events:none}
.rings{position:absolute;left:0;top:0;pointer-events:none;z-index:4}
.rings i{position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.9);transform:translate(-50%,-50%);animation:ring 3s ease-out infinite}
.rings i:nth-child(2){animation-delay:1s}.rings i:nth-child(3){animation-delay:2s}
@keyframes ring{from{width:60px;height:60px;opacity:.9}to{width:380px;height:380px;opacity:0}}

/* bottom */
.dock{position:absolute;left:0;right:0;bottom:0;z-index:15;display:grid;gap:10px;pointer-events:none;
  padding:0 max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(12px,env(safe-area-inset-left,0px))}
.dock > *{pointer-events:auto}
.sortbar{height:56px;border-radius:28px;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 8px 0 20px;margin:0 4px}
.sortbar .k{font-family:var(--f-kr);font-size:10px;color:var(--mute);margin-right:auto}
.chip{height:40px;padding:0 14px;border-radius:20px;border:0;background:var(--chip);font-family:var(--f-kr);font-size:12px;color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}

.sheet{border-radius:30px;background:rgba(255,255,255,.76);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.95);box-shadow:0 20px 50px rgba(120,40,110,.18);padding:16px 18px 16px;max-height:62vh;overflow-y:auto;overscroll-behavior:contain;animation:up .35s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.t1{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-kr);font-size:10px;letter-spacing:.06em;color:var(--mute)}
.nm{font-family:var(--f-disp);font-weight:900;font-style:italic;font-size:34px;letter-spacing:-.035em;margin-top:8px;line-height:1}
.by2{font-size:10px;color:var(--mute);margin-top:6px}
.lbl{font-size:8px;letter-spacing:.16em;color:var(--faint);display:flex;justify-content:space-between;margin:14px 0 7px}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:9px;color:var(--mute);margin-top:7px}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}
.tags{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.tg{height:28px;padding:0 11px;border-radius:14px;background:var(--chip);display:flex;align-items:center;gap:6px;font-family:var(--f-kr);font-size:11px}
.tg em{font-style:normal;font-family:var(--f-mono);font-size:8px;letter-spacing:.12em;color:var(--faint)}
.acts{display:flex;gap:10px;margin-top:14px}
.play{width:52px;height:52px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none;border:0;cursor:pointer}
.save{flex:1;height:52px;border-radius:26px;background:var(--chip);border:0;display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--f-kr);font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
.remix{height:52px;padding:0 18px;border-radius:26px;border:1px solid rgba(20,17,23,.14);background:transparent;font-family:var(--f-kr);font-size:13px;color:var(--ink);cursor:pointer}

/* tune */
.tune .th{display:flex;justify-content:space-between;align-items:baseline}
.tune .th b{font-family:var(--f-disp);font-style:italic;font-weight:900;font-size:22px;letter-spacing:-.02em}
.tune .th span{font-family:var(--f-kr);font-size:10px;color:var(--mute)}
.presets{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.grp{font-size:8px;letter-spacing:.16em;color:var(--faint);margin:16px 0 4px}
.sl{display:grid;grid-template-columns:62px 1fr 30px;align-items:center;gap:10px}
.sl label{font-family:var(--f-kr);font-size:12px}
.sl output{font-size:10px;color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}
.sl small{grid-column:2/4;margin-top:-6px;font-family:var(--f-kr);font-size:9.5px;color:var(--faint)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(var(--ink),var(--ink)) 0 0/var(--p) 100% no-repeat,rgba(20,17,23,.12)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--ink);margin-top:-8px}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(20,17,23,.12)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--ink)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--ink)}
.export{display:flex;gap:8px;margin-top:16px;align-items:center}
.export .save{height:48px}
.tog{display:flex;align-items:center;gap:8px;font-family:var(--f-kr);font-size:11px;color:var(--mute);cursor:pointer;background:none;border:0;padding:0 4px}
.tog .kn{width:32px;height:18px;border-radius:9px;background:rgba(20,17,23,.15);position:relative;flex:none}
.tog .kn::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s}
.tog[aria-pressed="true"] .kn{background:var(--ink)}
.tog[aria-pressed="true"] .kn::after{transform:translateX(14px)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 110px);transform:translateX(-50%);z-index:50;background:var(--ink);color:#fff;font-family:var(--f-kr);font-size:12px;padding:9px 16px;border-radius:20px;white-space:nowrap;pointer-events:none;transition:opacity .3s}
.fail{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--mute);font-family:var(--f-kr);line-height:1.7}
</style>

<script>
(()=>{

 {n:'subway home',tag:'BROWN · 지하철',by:'@jun',sv:'1.3k',c:['coral','brown','orange'],b:[20,5,15,60],lq:'지하철 · 터널',gn:'Tick ×2',gl:'Highball'},

 {n:'cafe corner',tag:'PINK · 웅성임',by:'@dami',sv:'960',c:['pink','orange','coral'],b:[50,15,10,25],lq:'카페 웅성임',gn:'Spark ×1',gl:'Rocks'},

 {n:'first snow',tag:'WHITE · 눈 밟기',by:'@seo',sv:'2.7k',c:['white','sky','pink'],b:[15,65,15,5],lq:'눈 밟는 소리',gn:'Star ×2',gl:'Coupe'},
 {n:'ferry deck',tag:'BLUE · 배 갑판',by:'@tae',sv:'390',c:['teal','blue','brown'],b:[10,15,45,30],lq:'갑판 · 갈매기',gn:'Drop ×1',gl:'Highball'},
 {n:'rooftop fan',tag:'WHITE · 환풍기',by:'@lin',sv:'150',c:['sky','orange','white'],b:[15,55,20,10],lq:'환풍기',gn:'Tick ×1',gl:'Rocks'},
 {n:'piano room',tag:'PINK · 연습실',by:'@nari',sv:'880',c:['pink','violet','white'],b:[45,30,10,15],lq:'건반 · 페달',gn:'Spark ×2',gl:'Martini'},
 {n:'train window',tag:'BROWN · 기차',by:'@hyun',sv:'1.6k',c:['brown','violet','orange'],b:[20,10,15,55],lq:'기차 레일',gn:'Tick ×2',gl:'Coupe'}

// 세계 배치: 지그재그 격자 + 흔들림, 끝없이 반복(토러스)
const COLS=4,ROWS=4,CW=300,CH=300;
const WW=COLS*CW,WH=ROWS*CH;
function rnd(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646;};}
const R=rnd(11);
MIXES.forEach((m,i)=>{
  const c=i%COLS,r=Math.floor(i/COLS);
  m.x=(c+.5+(r%2?.5:0))*CW+(R()-.5)*70; m.y=(r+.5)*CH+(R()-.5)*110;

  if(R()<.8)m.balls.push({a:R()*6.28,d:1.55+R()*.4,rf:.2+R()*.12,sp:.25+R()*.3,ph:R()*6.28,ci:Math.floor(R()*3),sat:1});
  m.col=m.c.map(k=>hex2(HEX[k]));
});

// ── 조절값
const DEF={spread:100,glow:100,goo:100,wash:35,washR:45,size:130,gap:85,flow:70,swirl:70,grain:0,sat:100};
const PRESETS={
  gradient:{...DEF,zoom:200,drift:25},
  metaball:{spread:12,glow:8,goo:55,size:95,gap:100,flow:45,swirl:50,grain:12,sat:110,wash:15,washR:35},
  cloud:{spread:92,glow:85,goo:35,size:125,gap:95,flow:20,swirl:20,grain:60,sat:105,wash:75,washR:65},
  liquid:{spread:30,glow:25,goo:70,size:130,gap:85,flow:70,swirl:70,grain:20,sat:120,wash:35,washR:45}
};
const S={...DEF};
const SL=[
 ['grp','경계'],
 ['spread','퍼짐',0,100,'경계가 얼마나 흐리게 번질지'],
 ['glow','번짐',0,100,'덩어리 바깥으로 퍼지는 색 안개'],
 ['goo','뭉침',0,100,'높을수록 공끼리 잘 붙어요'],
 ['grp','물듦'],
 ['wash','물듦',0,100,'덩어리 사이 빈 곳을 색으로 이어줘요'],
 ['washR','물듦 범위',0,100,'색이 얼마나 멀리까지 번질지'],
 ['grp','형태'],
 ['size','크기',40,170,''],
 ['gap','간격',60,160,'덩어리 사이 여백'],
 ['grp','안쪽 색'],
 ['flow','흐름',0,100,'색이 흐르고 공이 움직이는 속도'],
 ['swirl','소용돌이',0,100,'안쪽에서 색이 휘도는 정도'],
 ['grain','입자',0,100,'오돌토돌한 노이즈 질감'],
 ['sat','채도',30,150,'']
];
const slWrap=$('sliders');
SL.forEach(s=>{
  if(s[0]==='grp'){const d=document.createElement('div');d.className='grp';d.textContent=s[1];slWrap.appendChild(d);return;}
  const[id,lab,mn,mx,hint]=s;const d=document.createElement('div');d.className='sl';
  d.innerHTML=`<label for="s-${id}">${lab}</label><input id="s-${id}" type="range" min="${mn}" max="${mx}" value="${S[id]}"><output id="o-${id}">${S[id]}</output>${hint?`<small>${hint}</small>`:''}`;
  slWrap.appendChild(d);
  const el=d.querySelector('input');paint(el);
  el.addEventListener('input',()=>{S[id]=+el.value;$('o-'+id).textContent=el.value;paint(el);clearPreset();});
});
function paint(el){el.style.setProperty('--p',(el.value-el.min)/(el.max-el.min)*100+'%');}
function clearPreset(){[...$('presets').children].forEach(b=>b.setAttribute('aria-pressed','false'));}
function applyPreset(k){Object.assign(S,PRESETS[k]);Object.keys(S).forEach(id=>{const el=$('s-'+id);if(!el)return;el.value=S[id];$('o-'+id).textContent=S[id];paint(el);});
  [...$('presets').children].forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.p===k)));}
[...$('presets').children].forEach(b=>b.addEventListener('click',()=>applyPreset(b.dataset.p)));
applyPreset('gradient');

// ── WebGL
const gl=cv.getContext('webgl2',{antialias:false,premultipliedAlpha:false});
if(!gl){stage.insertAdjacentHTML('beforeend','<div class="fail">이 브라우저는 WebGL2를 지원하지 않아요.<br>최신 Safari / Chrome에서 열어주세요.</div>');return;}
const MAXM=12,MAXB=72;
const VS=`#version 300 es
in vec2 a;void main(){gl_Position=vec4(a,0.,1.);}`;
const FS=`#version 300 es
precision highp float;
uniform vec2 uRes;uniform float uDpr,uTime,uTh,uSpread,uGlow,uScale,uGrain,uSat,uDim,uWash,uWashR,uSwirlMix;uniform vec4 uGrade;
uniform vec2 uCam;uniform int uN;uniform int uFocus;
uniform vec4 uBall[${MAXB}];uniform vec3 uCol[${MAXM*3}];uniform vec3 uBg;
out vec4 o;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}
float noise(vec2 p){vec2 i=floor(p);vec2 f=fract(p);
  float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));
  vec2 u=f*f*(3.-2.*f);return mix(a,b,u.x)+(c-a)*u.y*(1.-u.x)+(d-b)*u.x*u.y;}
float fbm(vec2 p){float v=0.,a=.5;mat2 r=mat2(.8,.6,-.6,.8);
  for(int i=0;i<3;i++){v+=a*noise(p);p=r*p*2.15;a*=.45;}return v;}
vec3 pal3(int s,float t){
  vec3 a=uCol[s*3],b=uCol[s*3+1],c=uCol[s*3+2];
  t=fract(t)*3.;
  if(t<1.)return mix(a,b,smoothstep(0.,1.,t));
  if(t<2.)return mix(b,c,smoothstep(1.,2.,t));
  return mix(c,a,smoothstep(2.,3.,t));}
void main(){
  vec2 p=vec2(gl_FragCoord.x,uRes.y-gl_FragCoord.y)/uDpr;
  // 원본 index.html과 같은 도메인 워프 — 덩어리 안쪽에서 색이 흐름
  vec2 w=(p+uCam)*uScale;
  vec2 q=vec2(fbm(w*1.3+uTime*.02),fbm(w*1.5+1.));
  vec2 r=vec2(fbm(w*1.8+q*2.5+uTime*.05),fbm(w*1.4+q*1.2));
  float t=fbm(w*1.1+r*1.8)*1.9+r.x*.6+uTime*.03;
  float f=0.,ws=0.,wf=0.,gs=0.,gf=0.,gq=0.;vec3 col=vec3(0.),wcol=vec3(0.);
  for(int i=0;i<${MAXB};i++){
    if(i>=uN)break;
    vec4 b=uBall[i];vec2 d=p-b.xy;float dd=dot(d,d);
    float w1=b.z*b.z/(dd+1.);
    f+=w1;float w2=pow(w1,1.5);
    int ci=int(b.w);int s=ci/3;

    vec3 bc=mix(uCol[ci],pal3(s,t+float(s)*.37),uSwirlMix);

    float R=b.z*uWashR;float g=exp(-dd/(2.*R*R));

  }

  col=mix(col,wcol,.25);                                  // 경계를 더 부드럽게 이어줌
  float core=smoothstep(uTh*(1.-uSpread),uTh*(1.+uSpread*.35)+1e-3,f);
  float halo=pow(clamp(f/uTh,0.,1.),1.6)*uGlow*.75;
  float a=max(core,halo);
  float wa=(1.-exp(-gs*.75))*uWash;
  float n=hash(gl_FragCoord.xy+fract(uTime*7.)*53.);
  float gr=uGrain*.9;
  a=clamp(a+(n-.5)*gr*a*(1.-a)*4.,0.,1.);
  wa=clamp(wa+(n-.5)*gr*wa*(1.-wa)*3.,0.,1.);
  if(uFocus>=0){a*=mix(uDim,1.,wf/max(ws,1e-6));wa*=mix(uDim,1.,gf/max(gs,1e-6));}
  float lum=dot(col,vec3(.299,.587,.114));col=mix(vec3(lum),col,uSat);
  lum=dot(wcol,vec3(.299,.587,.114));wcol=mix(vec3(lum),wcol,uSat);
  vec3 base=mix(uBg,clamp(wcol,0.,1.),wa);
  vec3 c=mix(base,clamp(col,0.,1.),a);
  // 색감: 색조 회전 · 밝기 · 대비 · 따뜻함 (메타볼 영역에만)
  {float m=max(a,wa);vec3 g=c;
   float ch=cos(uGrade.x),shh=sin(uGrade.x);mat3 toY=mat3(.299,.596,.211,.587,-.274,-.523,.114,-.322,.312);mat3 toR=mat3(1.,1.,1.,.956,-.272,-1.106,.621,-.647,1.703);
   vec3 yiq=toY*g;yiq.yz=mat2(ch,shh,-shh,ch)*yiq.yz;g=toR*yiq;
   g=(g-.5)*uGrade.z+.5+uGrade.y;g+=vec3(uGrade.w,uGrade.w*.25,-uGrade.w);
   c=mix(c,clamp(g,0.,1.),m);}
  c+=(hash(gl_FragCoord.xy*1.7+uTime)-.5)*.06*uGrain*max(a,wa);
  o=vec4(clamp(c,0.,1.),1.);
}`;
function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(x));return x;}
const prog=gl.createProgram();gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));
gl.bindAttribLocation(prog,0,'a');gl.linkProgram(prog);gl.useProgram(prog);
const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const U={};['uRes','uDpr','uTime','uTh','uSpread','uGlow','uScale','uGrain','uSat','uDim','uWash','uWashR','uSwirlMix','uGrade','uCam','uN','uFocus','uBall','uCol','uBg'].forEach(k=>U[k]=gl.getUniformLocation(prog,k));
gl.uniform3f(U.uBg,.988,.984,.992);
const ballBuf=new Float32Array(MAXB*4),colBuf=new Float32Array(MAXM*9);

let W=0,H=0,dpr=1;
function layout(){const b=stage.getBoundingClientRect(),Zv=(b.width/REFW)*((S.zoom||170)/170);W=b.width/Zv;H=b.height/Zv;dpr=Math.min(devicePixelRatio||1,2)*Zv;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);const L=document.getElementById('labels');if(L){L.style.transformOrigin='0 0';L.style.transform=`scale(${Zv})`;L.style.width=W+'px';L.style.height=H+'px';}}

// ── 카메라 & 드래그
const cam={x:WW*.12,y:WH*.05,vx:0,vy:0};
let anim=null;     // 포커스 이동
const ptr={down:false,x:0,y:0,sx:0,sy:0,t:0,moved:false};
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);initAudio();anim=null;
  Object.assign(ptr,{down:true,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,t:performance.now(),moved:false});cam.vx=cam.vy=0;});
cv.addEventListener('pointermove',e=>{if(!ptr.down)return;const dx=e.clientX-ptr.x,dy=e.clientY-ptr.y;const now=performance.now(),dt=Math.max(now-ptr.t,8)/1000;

  MIXES.forEach(m=>{if(!m.sp)return;const d=Math.hypot(m.sp[0]-EAR.x,m.sp[1]-EAR.y);const u=Math.max(0,Math.min(1,(d-EAR.r)/(EAR.R-EAR.r)));const w=Math.pow(1-u,2.2);m.hear=w;if(w<.01)return;tot+=w;
    ['PINK','WHITE','BLUE','BROWN'].forEach((k,i)=>bw[k]+=w*(m.b[i]||0)/100);liqKeys(m).forEach(([k,v])=>lw[k]=(lw[k]||0)+w*v);
    if(m.live&&m.live.g.length){const st=amb.gn.get(m)||m.live.g.map((_,i)=>now+.4*i+Math.random());amb.gn.set(m,st);m.live.g.forEach((g,i)=>{if(now>=st[i]){st[i]=now+LIVE.per(g.k);LIVE.ping(g,w);}});}});
  const nrm=Math.max(1,tot),t=AC.currentTime;
  for(const k in amb.base)amb.base[k].gain.setTargetAtTime(bw[k]/nrm*.95,t,.12);
  const keys=new Set([...Object.keys(amb.liq),...Object.keys(lw)]);keys.forEach(k=>{const v=liqVoice(k);if(v)v.gain.setTargetAtTime((lw[k]||0)/nrm*1.4,t,.15);});
  MIXES.forEach(m=>{if(m.el)m.el.style.opacity=(.45+.55*Math.min(1,(m.hear||0)*1.4)).toFixed(2);});}
// 라벨: 메타볼 한가운데에 점 + 이름
placeLabels=function(){MIXES.forEach(m=>{const el=m.el;if(!m.vis||!m.sp){el.style.visibility='hidden';return;}el.style.visibility='';el.classList.remove('r');const k=1+.35*Math.pow(Math.min(1,(m.hear||0)*1.15),1.5);el.style.transform=`translate(${m.sp[0]}px,${m.sp[1]}px) translate(-50%,-5px) scale(${k.toFixed(3)})`;el.style.transformOrigin='50% 5px';el.style.zIndex=String(Math.round((m.hear||0)*100)+(m.live?50:0));el.classList.toggle('act',Math.hypot(m.sp[0]-EAR.x,m.sp[1]-EAR.y)<EAR.r*.85);});
  const dd=2*EAR.r;ear.style.width=ear.style.height=dd+'px';ear.style.transform=`translate(${EAR.x-EAR.r}px,${EAR.y-EAR.r}px)`;};
// 듣는 원 움직이기: 마우스를 따라감 · 가만두면 화면 가운데로 · 믹스를 누르거나 새 믹스가 오면 그 믹스에 붙음
stage.addEventListener('pointermove',e=>{const r=stage.getBoundingClientRect(),Zv=(r.width/REFW)*((S.zoom||170)/170);EAR.tx=(e.clientX-r.left)/Zv;EAR.ty=(e.clientY-r.top)/Zv;EAR.last=performance.now()/1000;EAR.anchor=null;});
playMix=function(m){EAR.anchor=m;EAR.last=performance.now()/1000;playing=true;setPlayIcon();};
stopMix=function(){EAR.anchor=null;playing=false;setPlayIcon();};
function earTick(dt,now){if(EAR.anchor&&EAR.anchor.sp){EAR.tx=EAR.anchor.sp[0];EAR.ty=EAR.anchor.sp[1];}else if(now-EAR.last>6){EAR.tx=W/2;EAR.ty=H/2;}
  if(!EAR.init){EAR.x=EAR.tx=W/2;EAR.y=EAR.ty=H/2;EAR.init=1;}const k=1-Math.exp(-dt*6);EAR.x+=(EAR.tx-EAR.x)*k;EAR.y+=(EAR.ty-EAR.y)*k;}

function fitUI(){UI.style.transform=`scale(${uiScale()})`;document.body.style.setProperty('--us',uiScale().toFixed(4));const F=uiScale()/zv();document.getElementById('labels').style.setProperty('--F',F.toFixed(4));}

const NOW0=Date.now();
function ago(m){const t=m.t?+m.t:(NOW0-((m.n.length*97)%55+3)*60000);const d=Math.max(0,(Date.now()-t)/60000);return d<1?'just now':d<60?Math.round(d)+'m ago':d<1440?Math.round(d/60)+'h ago':Math.round(d/1440)+'d ago';}
function relabel(m){if(!m.el||m.el.dataset.v2===m.n)return;m.el.dataset.v2=m.n;
  const v=document.createElement('div');v.className='v2';v.innerHTML=`<span class="dt"></span><span class="nm"></span><span class="us"></span><span class="ago"></span>`;
  v.querySelector('.nm').textContent=m.n;v.querySelector('.us').textContent=(m.by||'').replace(/^@/,'');[...m.el.querySelectorAll('.v2')].forEach(x=>x.remove());m.el.appendChild(v);}
// 소리 성격 문구 (체크리스트 1-3: 브라운 −6 · 핑크 −3 · 화이트 0 · 블루 +3)
function phrase(m){const[pk,wh,bl,br]=m.b.map(x=>(x||0)/100);const t=-6*br-3*pk+3*bl;
  return t<-4?'아주 깊고 낮은 소리':t<-2.2?'깊고 따뜻한 소리':t<-.8?'부드러운 중간 소리':t<.8?'깨끗하고 부드러운 소리':'밝고 날카로운 소리';}
const SWC={pink:'#FF2294',white:'#FFFFFF',blue:'#4583FF',brown:'#C95F19'};
function garIcon(k,n){const c=document.createElement('canvas');c.width=c.height=48;const g=c.getContext('2d');g.translate(24,24);g.fillStyle='#FFDBED';const R=20;g.beginPath();
  if(k==='spark'||k==='fizz'){const r2=k==='fizz'?.7:.42;for(let i=0;i<n*2;i++){const a=-Math.PI/2+i*Math.PI/n,r=i%2?R*r2:R;g.lineTo(r*Math.cos(a),r*Math.sin(a));}}
  else if(k==='blossom'){const pr=R*.42,cr=R-pr;for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;g.moveTo(cr*Math.cos(a)+pr,cr*Math.sin(a));g.arc(cr*Math.cos(a),cr*Math.sin(a),pr,0,7);}g.moveTo(cr+2,0);g.arc(0,0,cr,0,7);}
  else{for(let i=0;i<=64;i++){const t=i/64*Math.PI*2,r=R*(.84+.12*Math.cos(n*t));g.lineTo(r*Math.cos(t),r*Math.sin(t));}}
  g.fill();return c;}
let cardM=null;
function fillCard(m){cardM=m;const $c=id=>document.getElementById(id);$c('cTtl').textContent=phrase(m);
  const ks=['pink','white','blue','brown'],ord=ks.map((k,i)=>[k,m.b[i]||0]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,2);
  $c('cBase').innerHTML=ord.map(([k,v])=>`<span class="it"><span class="sw" style="background:${SWC[k]}"></span>${v}</span>`).join('');
  const lq=(m.live&&m.live.lk.length)?m.lq.split(' · ')[0]:(m.lq||'').split(' · ')[0];const lc=(m.hexCol&&m.hexCol[2])||'#8AFF9A';
  $c('cLiq').innerHTML=`<span class="ld" style="background:radial-gradient(circle,${lc} 0%,${lc}83 58%,${lc}00 100%)"></span><span></span>`;$c('cLiq').lastChild.textContent=lq||'—';
  const gl=$c('cGar');gl.innerHTML='';const gs=m.live&&m.live.g.length?m.live.g:[{k:'blossom',n:4},{k:'blossom',n:5}];gs.slice(0,3).forEach(x=>gl.appendChild(garIcon(x.k,x.n)));}
document.getElementById('cAdd').addEventListener('click',e=>{e.stopPropagation();if(cardM)toast(`내 글라스에 담았어요 · ${cardM.n}`);});
// 듣고 있는 믹스 = 가장 크게 들리는 믹스 (누르거나 새로 도착하면 그 믹스)
const _plPhone=placeLabels;
placeLabels=function(){if(document.documentElement.classList.contains('phone'))return _plPhone();const sc=uiScale(),Z=zv();let best=null,bh=.12;
  MIXES.forEach(m=>{relabel(m);if(m.vis&&m.sp&&(m.hear||0)>bh){bh=m.hear;best=m;}});if(EAR.anchor&&EAR.anchor.vis)best=EAR.anchor;
  MIXES.forEach(m=>{const el=m.el;if(!m.vis||!m.sp){el.style.visibility='hidden';return;}el.style.visibility='';el.classList.remove('r');el.classList.toggle('act',m===best);
    const r=(m===best?20:10)*sc/Z;el.style.transform=`translate(${m.sp[0]}px,${m.sp[1]}px) translate(-50%,${-r}px)`;el.style.zIndex=m===best?'50':'1';el.style.opacity='';});
  const card=document.getElementById('card'),ln=document.getElementById('lnk');
  if(!best){card.classList.add('off');ln.setAttribute('x2',ln.getAttribute('x1'));ln.setAttribute('y2',ln.getAttribute('y1'));return;}
  if(best!==cardM)fillCard(best);card.classList.remove('off');
  const k=Z/sc,dx=best.sp[0]*k,dy=best.sp[1]*k;   // 디자인 좌표(2560×1440)의 점 중심
  let L=dx+151,B=dy-48;if(L+455>2520)L=dx-151-455;if(B-555<20)B=555+20;if(B>1420)B=1420;
  card.style.left=L+'px';card.style.top=(B-555)+'px';
  const right=L>dx;ln.setAttribute('x1',dx+(right?10:-10));ln.setAttribute('y1',dy-2.5);ln.setAttribute('x2',right?L+8:L+455-8);ln.setAttribute('y2',B-7);};
// 둥근 버튼: 음량 / 찾기(검색 + 실시간 피드)
{const bv=document.getElementById('bVol'),bs=document.getElementById('bSch'),B=document.body;
 const set=(v,sO)=>{B.classList.toggle('vOpen',v);B.classList.toggle('sOpen',sO);bv.setAttribute('aria-pressed',String(v));bs.setAttribute('aria-pressed',String(sO));if(sO)setTimeout(()=>{const q=document.getElementById('sq');if(q)q.focus();},60);};
 bv.addEventListener('click',e=>{e.stopPropagation();set(!B.classList.contains('vOpen'),false);});

 [document.querySelector('.vol'),document.querySelector('.seaUI')].forEach(x=>x&&x.addEventListener('pointerdown',e=>e.stopPropagation()));}

function frame(){
  const now=performance.now()/1000,dt=Math.min(now-last,1/30);last=now;
  simT+=dt*(.15+S.flow/100*1.6);
  if(anim){cam.x+=(anim.tx-cam.x)*(1-Math.exp(-dt*6));cam.y+=(anim.ty-cam.y)*(1-Math.exp(-dt*6));if(Math.hypot(anim.tx-cam.x,anim.ty-cam.y)<.5)anim=null;}
  else if(!ptr.down){cam.x+=cam.vx*dt;cam.y+=cam.vy*dt;const k=Math.exp(-dt*3.2);cam.vx*=k;cam.vy*=k;}
  if(!anim&&!ptr.down&&S.drift>0){const sp=S.drift/100;cam.x+=Math.cos(now*.05)*sp*40*dt+sp*18*dt;cam.y+=Math.sin(now*.037)*sp*26*dt;}
  earTick(dt,now);render(simT,dpr);placeLabels();ambTick(dt,now);
  requestAnimationFrame(frame);
}

// ── PNG 저장 (3배 해상도)
let downloads=null;
if(window.claude&&window.claude.use)window.claude.use('downloads').then(d=>{downloads=d;}).catch(()=>{});
async function exportPNG(){
  const s=3,cw=Math.round(W*s),ch=Math.round(H*s);
  cv.width=cw;cv.height=ch;render(simT,s);
  const out=document.createElement('canvas');out.width=cw;out.height=ch;const ctx=out.getContext('2d');
  ctx.drawImage(cv,0,0);layout();
  if(withText){
    try{await document.fonts.ready;}catch(e){}
    ctx.scale(s,s);
    const disp="italic 900 46px Inter, 'Helvetica Neue', Arial, sans-serif";
    ctx.fillStyle='#141117';ctx.font=disp;ctx.textBaseline='alphabetic';
    const hr=stage.querySelector('.head').getBoundingClientRect(),sr=stage.getBoundingClientRect();
    const lg=stage.querySelector('.logo').getBoundingClientRect();ctx.fillText('DiG',lg.left-sr.left,lg.top-sr.top+38);
    const sb=stage.querySelector('.sub').getBoundingClientRect();ctx.font="400 10px 'Noto Sans KR', sans-serif";ctx.fillStyle='rgba(20,17,23,.56)';
    ctx.fillText(stage.querySelector('.sub').textContent,sb.left-sr.left,sb.top-sr.top+11);
    MIXES.forEach(m=>{if(!m.vis||m.el.style.visibility==='hidden')return;const dim=focused&&focused!==m;ctx.globalAlpha=dim?.22:1;
      const right=m.el.classList.contains('r');const ax=m.sp[0],ay=m.sp[1];
      ctx.textAlign=right?'right':'left';
      ctx.beginPath();ctx.arc(ax,ay,4.5,0,6.283);ctx.fillStyle=HEX[m.c[0]];ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle='rgba(255,255,255,.8)';ctx.stroke();
      const tx=right?ax-11:ax+11;
      ctx.font="400 9px 'Noto Sans KR', sans-serif";ctx.fillStyle='rgba(20,17,23,.56)';ctx.fillText(m.tag,tx,ay+3);
      const nx=right?ax-11:ax+11;
      ctx.font="italic 900 23px Inter, 'Helvetica Neue', Arial, sans-serif";ctx.fillStyle='#141117';ctx.fillText(m.n,nx,ay+27);
      ctx.font="400 9px 'Space Mono', monospace";ctx.fillStyle='rgba(20,17,23,.56)';ctx.fillText(`${m.by} · 저장 ${m.sv}`,nx,ay+41);
    });
    ctx.globalAlpha=1;
  }
  const blob=await new Promise(r=>out.toBlob(r,'image/png'));
  const name='noisebar-dig-'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')+'.png';
  if(downloads){try{await downloads.save({filename:name,data:blob});toast('PNG를 저장했어요');}catch(e){if(e&&e.code!=='declined')toast('저장할 수 없는 환경이에요');}return;}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);toast('PNG를 저장했어요');}
  catch(e){toast('저장할 수 없는 환경이에요');}
}
$('pngBtn').addEventListener('click',exportPNG);$('quickPng').addEventListener('click',exportPNG);
