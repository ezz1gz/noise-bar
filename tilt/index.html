<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NØISE BAR · 청감 모드 소리 시범</title>
<style>
:root{--ink:#141117;--mute:#8a8590;--pk:#FF2D8A}
*{box-sizing:border-box}
body{margin:0;background:#f6f4f8;color:var(--ink);font:14px/1.5 Pretendard,'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 60px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px}
@media(max-width:860px){.wrap{grid-template-columns:1fr;padding:18px 14px 40px}}
h1{grid-column:1/-1;margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em}
.lead{grid-column:1/-1;margin:-10px 0 0;color:var(--mute)}
.stage{position:relative;background:radial-gradient(120% 90% at 50% 40%,#2b2340,#120f1a);border-radius:22px;aspect-ratio:1/1;overflow:hidden;touch-action:none;cursor:grab}
.stage:active{cursor:grabbing}
canvas{width:100%;height:100%;display:block}
.hint{position:absolute;left:0;right:0;top:14px;text-align:center;color:#fff;font-size:13px;opacity:.75;pointer-events:none}
.hud{position:absolute;left:16px;right:16px;bottom:12px;display:flex;justify-content:space-between;color:#fff;opacity:.75;font-size:12px;pointer-events:none}
.panel{background:#fff;border-radius:20px;padding:18px;box-shadow:0 0 0 1px rgba(20,17,23,.06),0 14px 40px rgba(40,20,50,.08);display:grid;gap:16px;align-content:start}
.grp>b{display:block;font-size:11px;color:var(--mute);font-weight:600;margin-bottom:6px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:#f0eef2;border-radius:12px;padding:3px}
.seg button,.chips button{font:inherit;border:0;background:transparent;border-radius:9px;height:34px;cursor:pointer;color:#555}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chips button{background:#f0eef2;height:auto;padding:8px 10px;text-align:left;line-height:1.35}
.chips button small{display:block;color:var(--mute);font-size:11px}
.chips button[aria-pressed=true]{background:var(--ink);color:#fff}.chips button[aria-pressed=true] small{color:#cfcad6}
.tog{display:flex;align-items:flex-start;gap:8px;padding:5px 0;cursor:pointer}
.tog input{accent-color:var(--pk);width:16px;height:16px;margin-top:2px}
.tog small{display:block;color:var(--mute);font-size:11.5px}
.row{display:flex;gap:8px}
.btn{flex:1;font:600 14px inherit;font-family:inherit;height:44px;border-radius:22px;border:0;cursor:pointer;background:#f0eef2;color:var(--ink)}
.btn.pri{background:var(--ink);color:#fff}
.btn.pk{background:var(--pk);color:#fff}
.btn[aria-pressed=true]{background:#6b4cff;color:#fff}
.now{font-size:12.5px;color:#4a4550;background:#f7f5f9;border-radius:12px;padding:10px 12px;line-height:1.65;min-height:76px}
.now b{color:var(--ink)}
.dis .nw{opacity:.4;pointer-events:none}
</style></head><body>
<div class="wrap">
<h1>청감 모드 · 360° 소리 시범</h1>
<p class="lead">위에서 내려다본 잔이에요. 가운데가 듣는 나(코가 위쪽 = 앞)예요. 이어폰을 꼭 끼고 들어보세요. 샘플 잔: 브라운 50·핑크 50 + 리큐르 파도·시계 + 가니쉬 SPARK.</p>
<div class="stage" id="stage"><canvas id="cv"></canvas><div class="hint" id="hint">기울이고 싶은 방향으로 끌어보세요 · 폰은 직접 기울이기</div><div class="hud"><span id="hT"></span><span id="hS"></span></div></div>
<aside class="panel">
  <div class="row"><button class="btn pri" id="play">▶ 소리 켜기</button><button class="btn" id="swirl" aria-pressed="false">↻ 스월링</button><button class="btn pk" id="shake">흔들기</button></div>
  <div class="grp"><b>비교</b><div class="seg"><button id="mOld" aria-pressed="false">지금 방식 (좌우만)</button><button id="mNew" aria-pressed="true">새 방식 (360°)</button></div></div>
  <div class="grp nw"><b>잔 — 재료가 어떻게 움직이고 다가오는지 정해요</b><div class="chips" id="glasses"></div></div>
  <div class="grp nw"><b>효과</b>
    <label class="tog"><input type="checkbox" id="eNear" checked><span>리큐르·가니쉬가 다가오기<small>기울일수록 귀 가까이 — 크고 또렷하고 마른 소리로</small></span></label>
    <label class="tog"><input type="checkbox" id="eHeight" checked><span>높이 층<small>베이스는 아래, 리큐르는 귀 높이, 가니쉬는 위에서</small></span></label>
    <label class="tog"><input type="checkbox" id="eSlosh" checked><span>출렁임<small>흔들면 재료가 나를 한 바퀴 휘돌고, 잔 벽에 닿으면 가니쉬가 울려요</small></span></label>
  </div>
  <div class="row" id="calRow" hidden><button class="btn" id="cal">지금 자세를 똑바로로</button></div>
  <div class="now" id="now">소리를 켜고 화면을 끌거나 스월링을 눌러보세요.</div>
</aside>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id);
// 잔: k = 따라오는 빠르기, near = 얼마나 가까이 오는지, conv = 재료가 한쪽으로 모이는 정도, spread = 기본 벌어짐, verb = 잔 몸통 울림, lag = 재료끼리 시차
const GL={
 flute:{n:'좁은 림',s:'플루트 · 하이볼',k:7,near:.85,conv:.95,spread:.7,verb:.12,lag:.2,rim:.55},
 snifter:{n:'모으는 잔',s:'스니프터 · 튤립',k:4,near:.75,conv:1,spread:1.2,verb:.22,lag:.35,warm:1,rim:.7},
 rocks:{n:'퍼뜨리는 잔',s:'락 · 쿠페',k:9,near:.45,conv:.35,spread:2.4,verb:.08,lag:.1,rim:.95},
 wine:{n:'둥근 볼',s:'와인',k:2.4,near:.7,conv:.7,spread:1.6,verb:.38,lag:.7,rim:.8}};
let glass='wine',mode='new',swirl=false,held=0;
Object.entries(GL).forEach(([k,g])=>{const b=document.createElement('button');b.dataset.k=k;b.setAttribute('aria-pressed',String(k===glass));b.innerHTML=`${g.n}<small>${g.s}</small>`;b.onclick=()=>{glass=k;[...$('glasses').children].forEach(x=>x.setAttribute('aria-pressed',String(x===b)));held=0;if(AC)setVerb();};$('glasses').appendChild(b);});
const panel=document.querySelector('.panel');
$('mOld').onclick=()=>{mode='old';$('mOld').setAttribute('aria-pressed','true');$('mNew').setAttribute('aria-pressed','false');panel.classList.add('dis');setModel();};
$('mNew').onclick=()=>{mode='new';$('mNew').setAttribute('aria-pressed','true');$('mOld').setAttribute('aria-pressed','false');panel.classList.remove('dis');setModel();};
$('swirl').onclick=()=>{swirl=!swirl;$('swirl').setAttribute('aria-pressed',String(swirl));};
const E=id=>$(id).checked;

// ── 재료 3층: 위치(x,y: 잔 반지름 1 기준, 위 = 앞), 속도
const LY={
 base:{n:'베이스',c:[240,120,80],w:.6,off:0,el:-.55},
 liq:{n:'리큐르',c:[95,165,255],w:1,off:2.1,el:0},
 gar:{n:'가니쉬',c:[255,255,255],w:1.5,off:-2.1,el:.7}};
for(const k in LY)Object.assign(LY[k],{x:0,y:0,vx:0,vy:0});

// ── 오디오
let AC=null,N={};
function genBuf(sec,fn,target=.12){const sr=AC.sampleRate,n=Math.round(sec*sr),b=AC.createBuffer(1,n,sr),d=b.getChannelData(0);fn(d,sr,n);let s=0;for(let i=0;i<n;i++)s+=d[i]*d[i];const k=target/(Math.sqrt(s/n)||1);for(let i=0;i<n;i++)d[i]*=k;const f=Math.round(sr*.05);for(let i=0;i<f;i++){const a=i/f;d[i]=d[i]*a+d[n-f+i]*(1-a);}return b;}
const brownGen=(d,n,k=.02)=>{let l=0;for(let i=0;i<n;i++){l=(l+k*(Math.random()*2-1))/(1+k);d[i]=l;}};
async function loadOr(url,fallback){try{const r=await fetch(url);if(!r.ok)throw 0;const b=await AC.decodeAudioData(await r.arrayBuffer());return seam(b);}catch(_){return fallback();}}
function seam(b){const sr=b.sampleRate,n=b.length,f=Math.round(sr*.8);for(let c=0;c<b.numberOfChannels;c++){const d=b.getChannelData(c);for(let i=0;i<f;i++){const a=i/f;d[i]=d[i]*Math.sqrt(a)+d[n-f+i]*Math.sqrt(1-a);}}return b;}
function loop(b,dest,g=1){const s=AC.createBufferSource(),gn=AC.createGain();gn.gain.value=g;s.buffer=b;s.loop=true;s.loopEnd=b.duration-.8;s.connect(gn);gn.connect(dest);s.start(0,Math.random()*(b.duration-2));return s;}
function impulse(sec,decay){const sr=AC.sampleRate,n=sr*sec,b=AC.createBuffer(2,n,sr);for(let c=0;c<2;c++){const d=b.getChannelData(c);let lp=0;for(let i=0;i<n;i++){lp+=((Math.random()*2-1)-lp)*.35;d[i]=lp*Math.pow(1-i/n,decay);}}return b;}
function setVerb(){N.verb.buffer=impulse(.8+GL[glass].verb*6,2.6);}
function setModel(){if(!AC)return;for(const k in N.L)N.L[k].p.panningModel=mode==='new'?'HRTF':'equalpower';}
async function start(){
 AC=new (window.AudioContext||window.webkitAudioContext)();const A=AC;
 N.out=A.createGain();N.out.gain.value=.9;
 const comp=A.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=3;
 N.master=A.createBiquadFilter();N.master.type='lowpass';N.master.frequency.value=11000;N.master.Q.value=.5;
 N.warm=A.createBiquadFilter();N.warm.type='lowshelf';N.warm.frequency.value=300;N.warm.gain.value=0;
 N.dry=A.createGain();N.dry.connect(N.warm);N.warm.connect(N.master);N.master.connect(comp);comp.connect(N.out);N.out.connect(A.destination);
 N.verb=A.createConvolver();setVerb();N.vOut=A.createGain();N.vOut.gain.value=.9;N.verb.connect(N.vOut);N.vOut.connect(N.warm);
 const layer=()=>{const g=A.createGain(),f=A.createBiquadFilter(),near=A.createBiquadFilter(),p=A.createPanner(),s=A.createGain();
  f.type='lowpass';f.frequency.value=16000;f.Q.value=.5;near.type='lowshelf';near.frequency.value=220;near.gain.value=0;
  p.panningModel='HRTF';p.distanceModel='linear';p.rolloffFactor=0;p.refDistance=1;p.maxDistance=100;
  g.connect(f);f.connect(near);near.connect(p);p.connect(N.dry);near.connect(s);s.connect(N.verb);return{g,f,near,p,s};};
 N.L={base:layer(),liq:layer(),gar:layer()};
 // 실제 녹음된 브라운·핑크 노이즈
 const [brown,pink]=await Promise.all([loadOr('brown.mp3',()=>genBuf(8,(d,sr,n)=>brownGen(d,n))),loadOr('pink.mp3',()=>genBuf(8,(d,sr,n)=>brownGen(d,n,.06)))]);
 loop(brown,N.L.base.g,.9);loop(pink,N.L.base.g,.75);
 // 리큐르: 파도(숨) + 시계(박자) — 앱과 같은 합성
 const waves=genBuf(16,(d,sr,n)=>{let l=0;for(let i=0;i<n;i++){const t=i/sr,w=Math.random()*2-1;l=(l+.02*w)/1.02;const ph=(t%8)/8;d[i]=(l*3+w*.03)*(.12+.88*Math.pow(Math.max(0,Math.sin(Math.PI*ph)),1.8));}});
 const clock=genBuf(8,(d,sr,n)=>{for(let k=0;k<16;k++){const st=Math.round(k*.5*sr),f=k%2?1200:1600;for(let j=0;j<sr*.08&&st+j<n;j++){const t=j/sr;d[st+j]+=(Math.sin(2*Math.PI*f*t)*.8+Math.sin(2*Math.PI*f*.5*t)*.4)*Math.exp(-t*60);}}},.07);
 loop(waves,N.L.liq.g,1.1);loop(clock,N.L.liq.g,.6);
 setModel();gTimer();}
function bell(v=1,f=1046.5){if(!AC)return;const t=AC.currentTime+.01;[[1,1],[2.01,.35],[3.0,.12]].forEach(([m,a])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f*m;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.14*v*a,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+1.6/m);o.connect(g);g.connect(N.L.gar.g);o.start(t);o.stop(t+1.8);});}
const NOTES=[1046.5,1318.5,1568,1174.7,1396.9];
function gTimer(){let k=0;setInterval(()=>{if(AC&&AC.state==='running')bell(.9,NOTES[k++%NOTES.length]);},1500);}
$('play').onclick=async()=>{
 if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function'){try{await DeviceOrientationEvent.requestPermission();}catch(_){}}
 if(window.DeviceMotionEvent&&typeof DeviceMotionEvent.requestPermission==='function'){try{await DeviceMotionEvent.requestPermission();}catch(_){}}
 if(!AC){$('play').textContent='불러오는 중…';await start();await AC.resume();$('play').textContent='❚❚ 소리 끄기';return;}
 if(AC.state==='running'){await AC.suspend();$('play').textContent='▶ 소리 켜기';}else{await AC.resume();$('play').textContent='❚❚ 소리 끄기';}};
function kick(p){for(const k in LY){const L=LY[k],a=Math.random()*Math.PI*2;L.vx+=Math.cos(a)*p*L.w;L.vy+=Math.sin(a)*p*L.w;}}
$('shake').onclick=()=>kick(5);

// ── 기울기 입력 (2D): 끌기 · 폰 기울기 · 스월링
const st=$('stage');let drag=false,tx=0,ty=0,ori=null,cal={b:40,g:0},swA=-Math.PI/2;
const toV=e=>{const r=st.getBoundingClientRect(),R=r.width*.4;let x=(e.clientX-r.left-r.width/2)/R,y=(e.clientY-r.top-r.height/2)/R;const m=Math.hypot(x,y);if(m>1){x/=m;y/=m;}tx=x;ty=y;};
st.addEventListener('pointerdown',e=>{st.setPointerCapture(e.pointerId);drag=true;swirl=false;$('swirl').setAttribute('aria-pressed','false');toV(e);});
st.addEventListener('pointermove',e=>{if(drag)toV(e);});
const up=()=>{drag=false;};st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
addEventListener('deviceorientation',e=>{if(e.gamma==null||Math.abs(e.beta||0)+Math.abs(e.gamma)<.5)return;ori={b:e.beta,g:e.gamma};$('calRow').hidden=false;});
$('cal').onclick=()=>{if(ori)cal={...ori};};
let lastAcc=null;addEventListener('devicemotion',e=>{const a=e.acceleration;if(!a||a.x==null)return;const m=Math.hypot(a.x,a.y,a.z);if(m>9&&(!lastAcc||performance.now()-lastAcc>300)){lastAcc=performance.now();kick(Math.min(7,m*.4));}});
let vx=0,vy=0; // 실제 기울기(부드럽게)
function input(dt){let ix=0,iy=0;
 if(drag){ix=tx;iy=ty;}
 else if(swirl){swA+=dt*2.4;ix=Math.cos(swA)*.7;iy=Math.sin(swA)*.7;}
 else if(ori){ix=Math.max(-1,Math.min(1,(ori.g-cal.g)/40));iy=Math.max(-1,Math.min(1,-(ori.b-cal.b)/40));const m=Math.hypot(ix,iy);if(m>1){ix/=m;iy/=m;}}
 const a=1-Math.exp(-dt*(drag?14:5));vx+=(ix-vx)*a;vy+=(iy-vy)*a;}

// ── 물리: 기울인 쪽으로 액체가 쏠림 → 재료마다 다른 목표점, 스프링으로 따라감
let theta=-Math.PI/2,lastHit=0;
function physics(dt){const g=GL[glass],m=Math.min(1,Math.hypot(vx,vy));if(m>.04){let d=Math.atan2(vy,vx)-theta;d=Math.atan2(Math.sin(d),Math.cos(d));theta+=d*Math.min(1,dt*10);}
 for(const k in LY){const L=LY[k];let ang,rad;
  if(mode==='old'){ang=-Math.PI/2;rad=0;L.tx=vx*.9;L.ty=-.6;}
  else{
   const near=E('eNear')?g.near:0;
   if(k==='base'){ang=theta;rad=.2+.6*m;}             // 무거운 베이스: 기운 쪽 바닥으로 쏠림
   else{ang=theta+L.off*(g.spread/2.1)*(1-g.conv*m)*(1);rad=(.92-near*m)*(k==='gar'?1:.95);} // 리큐르·가니쉬: 기울수록 한쪽에 모이며 귀 가까이
   L.tx=Math.cos(ang)*rad;L.ty=Math.sin(ang)*rad;}
  const kk=g.k*(1+L.w*.4)*(1-g.lag*(L.w-1)*.3),damp=E('eSlosh')?2*Math.sqrt(kk)*.45:2*Math.sqrt(kk);
  L.vx+=((L.tx-L.x)*kk-L.vx*damp)*dt;L.vy+=((L.ty-L.y)*kk-L.vy*damp)*dt;L.x+=L.vx*dt;L.y+=L.vy*dt;
  const r=Math.hypot(L.x,L.y);if(r>1){ // 잔 벽
   const nx=L.x/r,ny=L.y/r,vn=L.vx*nx+L.vy*ny;L.x=nx;L.y=ny;if(vn>0){L.vx-=1.6*vn*nx;L.vy-=1.6*vn*ny;
    if(E('eSlosh')&&mode==='new'&&vn>.8&&performance.now()-lastHit>220){lastHit=performance.now();bell(Math.min(1,vn*.5),NOTES[(Math.random()*5)|0]*2*.5);}}}}}

// ── 위치 → 소리
const set=(p,v,tc=.05)=>p.setTargetAtTime(v,AC.currentTime,tc);
function audio(dt){if(!AC)return;const g=GL[glass];
 for(const k in LY){const L=LY[k],n=N.L[k],d=Math.min(1,Math.hypot(L.x,L.y));
  // 거리 1 = 잔 끝(멀리), 0 = 귀 바로 옆
  const S=3,px=L.x*S,pz=L.y*S,py=(mode==='new'&&E('eHeight'))?L.el*S*.8:0;
  const mag=Math.max(.35,Math.hypot(px,py,pz));const fx=px/mag*Math.max(.35,mag),fy=py/mag*Math.max(.35,mag),fz=pz/mag*Math.max(.35,mag);
  if(n.p.positionX){set(n.p.positionX,fx);set(n.p.positionY,fy);set(n.p.positionZ,fz);}else n.p.setPosition(fx,fy,fz);
  if(mode==='old'){set(n.g.gain,k==='base'?1:.8);set(n.f.frequency,16000);set(n.near.gain,0);set(n.s.gain,.12);continue;}
  const close=1-d; // 가까울수록 1
  const base=k==='base'?1:.85;
  set(n.g.gain,base*(.28+1.25*Math.pow(close,1.6)));            // 크기
  set(n.f.frequency,1800*Math.pow(16000/1800,Math.pow(close,.7))); // 멀면 어둡게
  set(n.near.gain,k==='base'?0:7*Math.pow(close,2));               // 가까우면 근접 저음(귀 옆 느낌)
  set(n.s.gain,.05+.85*d*d*(.5+g.verb*1.5));}                      // 멀면 잔 울림 속으로
 held=g.warm?Math.min(1,held+dt*.07):0;set(N.warm.gain,held*7,.3);}

// ── 설명
function describe(){const g=GL[glass],m=Math.hypot(vx,vy);
 if(!AC)return;if(mode==='old')return '<b>지금 방식</b> · 소리가 왼쪽·오른쪽으로만 옮겨 가요. 앞뒤·위아래·가까움이 없어요.';
 const dir=['오른쪽으로','오른쪽 뒤로','뒤로','왼쪽 뒤로','왼쪽으로','왼쪽 앞으로','앞으로','오른쪽 앞으로'][((Math.round(theta/(Math.PI/4))%8)+8)%8];
 const dl=Math.hypot(LY.liq.x,LY.liq.y),dg=Math.hypot(LY.gar.x,LY.gar.y);
 let s=`<b>${g.n}</b> · `;
 if(m<.08&&!swirl)s+='잔을 세우면 리큐르·가니쉬는 멀리 둘레에서, 베이스는 바로 앞 아래에서 들려요.';
 else s+=`<b>${dir}</b> 기울임 → 베이스가 그쪽 바닥으로 쏠리고, `+(E('eNear')?`리큐르(${dl<.45?'<b>귀 바로 옆</b>':dl<.75?'가까이':'멀리'})·가니쉬(${dg<.45?'<b>귀 바로 옆</b>':dg<.75?'가까이':'멀리'})가 다가와요.`:'리큐르·가니쉬도 함께 돌아요.');
 if(swirl)s+=' 스월링 — 재료가 나를 한 바퀴씩 휘돌아요.';if(held>.3)s+=' 손 온도로 따뜻해지는 중.';return s;}

// ── 그림 (위에서 본 잔)
