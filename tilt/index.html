<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NØISE BAR · 청감 모드 소리 시범</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--ink:#141117;--mute:#8a8590;--line:#e8e5ec;--pk:#FF2D8A}
*{box-sizing:border-box}
body{margin:0;background:#f6f4f8;color:var(--ink);font:14px/1.5 Pretendard,'Noto Sans KR',system-ui,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 60px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px}
@media(max-width:860px){.wrap{grid-template-columns:1fr}}
h1{grid-column:1/-1;margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em}
.lead{grid-column:1/-1;margin:-10px 0 0;color:var(--mute)}
.stage{position:relative;background:linear-gradient(160deg,#4a86f0,#9a6ad8 55%,#e58aa8);border-radius:22px;aspect-ratio:4/5;overflow:hidden;touch-action:none;cursor:grab}
.stage:active{cursor:grabbing}
canvas{width:100%;height:100%;display:block}
.hud{position:absolute;left:16px;right:16px;bottom:14px;display:flex;justify-content:space-between;color:#fff;font-size:12px;text-shadow:0 1px 6px rgba(0,0,0,.25);pointer-events:none}
.hint{position:absolute;left:0;right:0;top:16px;text-align:center;color:#fff;font-size:13px;opacity:.9;pointer-events:none;text-shadow:0 1px 6px rgba(0,0,0,.25)}
.panel{background:#fff;border-radius:20px;padding:18px;box-shadow:0 0 0 1px rgba(20,17,23,.06),0 14px 40px rgba(40,20,50,.08);display:grid;gap:16px;align-content:start}
.grp>b{display:block;font-size:11px;color:var(--mute);font-weight:600;margin-bottom:6px;letter-spacing:.02em}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:#f0eef2;border-radius:12px;padding:3px}
.seg button,.chips button{font:inherit;border:0;background:transparent;border-radius:9px;height:34px;cursor:pointer;color:#555}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chips button{background:#f0eef2;height:auto;padding:8px 10px;text-align:left;line-height:1.35}
.chips button small{display:block;color:var(--mute);font-size:11px}
.chips button[aria-pressed=true]{background:var(--ink);color:#fff}.chips button[aria-pressed=true] small{color:#cfcad6}
.tog{display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer}
.tog input{accent-color:var(--pk);width:16px;height:16px}
.tog small{color:var(--mute)}
input[type=range]{width:100%;accent-color:var(--ink)}
.row{display:flex;gap:8px}
.btn{flex:1;font:600 14px Pretendard,sans-serif;height:44px;border-radius:22px;border:0;cursor:pointer;background:#f0eef2;color:var(--ink)}
.btn.pri{background:var(--ink);color:#fff}
.btn.pk{background:var(--pk);color:#fff}
.now{font-size:12.5px;color:#4a4550;background:#f7f5f9;border-radius:12px;padding:10px 12px;line-height:1.6;min-height:70px}
.now b{color:var(--ink)}
.dis .tog,.dis .grp.nw{opacity:.4;pointer-events:none}
</style></head><body>
<div class="wrap">
<h1>청감 모드 · 소리 시범</h1>
<p class="lead">샘플 잔: 브라운 50 · 핑크 50 베이스 + 리큐르 파도(숨)·시계(박자) + 가니쉬 SPARK. 이어폰을 끼면 차이가 훨씬 잘 들려요.</p>
<div class="stage" id="stage"><canvas id="cv"></canvas><div class="hint" id="hint">좌우로 끌거나 폰을 기울여 보세요</div><div class="hud"><span id="hT">기울기 0°</span><span id="hS"></span></div></div>
<aside class="panel">
  <div class="row"><button class="btn pri" id="play">▶ 소리 켜기</button><button class="btn pk" id="shake">흔들기</button></div>
  <div class="grp"><b>비교</b><div class="seg"><button id="mOld" aria-pressed="false">지금 방식</button><button id="mNew" aria-pressed="true">새 방식</button></div></div>
  <div class="grp nw"><b>잔 — 기울일 때 반응을 정해요</b><div class="chips" id="glasses"></div></div>
  <div class="grp nw" id="effs"><b>효과</b>
    <label class="tog"><input type="checkbox" id="eLayer" checked><span>① 재료가 층으로 쏟아지기 <small>기운 쪽 재료가 앞으로</small></span></label>
    <label class="tog"><input type="checkbox" id="eSink" checked><span>② 잔 속으로 잠기기 <small>많이 기울이면 먹먹하게</small></span></label>
    <label class="tog"><input type="checkbox" id="eRim" checked><span>③ 림 공명 <small>기울기 따라 음높이 미끄러짐</small></span></label>
    <label class="tog"><input type="checkbox" id="eSlosh" checked><span>④ 출렁임 <small>흔들면 쏴아 · 벽에 닿으면 가니쉬</small></span></label>
  </div>
  <div class="grp"><b>기울기</b><input type="range" id="tilt" min="-60" max="60" value="0" step="1" aria-label="기울기"></div>
  <div class="now" id="now">소리를 켜고 기울여 보세요.</div>
</aside>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id);
// ── 잔 4종: 글라스 = 청감 모드 반응을 정하는 설정
const GL={
 flute:{n:'좁은 림',s:'플루트 · 하이볼',need:.55,curve:1.9,width:.35,f0:2600,q:9,oct:1.3,sink:1,verb:.08,slosh:.6,shape:'flute'},
 snifter:{n:'모으는 잔',s:'스니프터 · 튤립',need:.4,curve:1.2,width:.15,f0:900,q:4,oct:.8,sink:.8,verb:.18,slosh:.8,warm:1,shape:'snifter'},
 rocks:{n:'퍼뜨리는 잔',s:'락 · 쿠페',need:.2,curve:.6,width:1,f0:1500,q:1.2,oct:.6,sink:.45,verb:.05,slosh:.7,shape:'rocks'},
 wine:{n:'둥근 볼',s:'와인',need:.35,curve:1,width:.6,f0:620,q:2.4,oct:1,sink:.75,verb:.32,slosh:1.4,shape:'wine'}};
let glass='wine',mode='new',tilt=0,tTarget=0,slosh=0,sloshV=0,held=0;
Object.entries(GL).forEach(([k,g])=>{const b=document.createElement('button');b.dataset.k=k;b.setAttribute('aria-pressed',String(k===glass));b.innerHTML=`${g.n}<small>${g.s}</small>`;b.onclick=()=>{glass=k;[...$('glasses').children].forEach(x=>x.setAttribute('aria-pressed',String(x===b)));held=0;};$('glasses').appendChild(b);});
$('mOld').onclick=()=>{mode='old';$('mOld').setAttribute('aria-pressed','true');$('mNew').setAttribute('aria-pressed','false');document.querySelector('.panel').classList.add('dis');};
$('mNew').onclick=()=>{mode='new';$('mNew').setAttribute('aria-pressed','true');$('mOld').setAttribute('aria-pressed','false');document.querySelector('.panel').classList.remove('dis');};
const E=id=>$(id).checked;
// ── 오디오
let AC=null,N={};
function buf(sec,fn,target=.12){const sr=AC.sampleRate,n=Math.round(sec*sr),b=AC.createBuffer(1,n,sr),d=b.getChannelData(0);fn(d,sr,n);let s=0;for(let i=0;i<n;i++)s+=d[i]*d[i];const k=target/(Math.sqrt(s/n)||1);for(let i=0;i<n;i++)d[i]*=k;return b;}
const pinkF=(d,n)=>{let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;b0=.99886*b0+w*.0555179;b1=.99332*b1+w*.0750759;b2=.969*b2+w*.153852;b3=.8665*b3+w*.3104856;b4=.55*b4+w*.5329522;b5=-.7616*b5-w*.016898;d[i]=b0+b1+b2+b3+b4+b5+b6+w*.5362;b6=w*.115926;}};
function loop(b,dest){const s=AC.createBufferSource();s.buffer=b;s.loop=true;s.connect(dest);s.start(0,Math.random()*b.duration);return s;}
function impulse(sec,decay){const sr=AC.sampleRate,n=sr*sec,b=AC.createBuffer(2,n,sr);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay);}return b;}
function start(){
 AC=new (window.AudioContext||window.webkitAudioContext)();const A=AC;
 // 체인: 층별 → (림 공명 · 잠김 · 지금방식 셸프) → 잔향 → 출력
 N.out=A.createGain();N.out.gain.value=.85;N.out.connect(A.destination);
 N.verb=A.createConvolver();N.verb.buffer=impulse(1.8,3);N.vWet=A.createGain();N.vWet.gain.value=.1;N.verb.connect(N.vWet);N.vWet.connect(N.out);
 N.sink=A.createBiquadFilter();N.sink.type='lowpass';N.sink.frequency.value=18000;N.sink.Q.value=.7;
 N.rim=A.createBiquadFilter();N.rim.type='peaking';N.rim.frequency.value=1000;N.rim.Q.value=2;N.rim.gain.value=0;
 N.hs=A.createBiquadFilter();N.hs.type='highshelf';N.hs.frequency.value=3000;N.ls=A.createBiquadFilter();N.ls.type='lowshelf';N.ls.frequency.value=250;
 N.warm=A.createBiquadFilter();N.warm.type='lowshelf';N.warm.frequency.value=320;N.warm.gain.value=0;
 N.bus=A.createGain();N.bus.connect(N.rim);N.rim.connect(N.warm);N.warm.connect(N.hs);N.hs.connect(N.ls);N.ls.connect(N.sink);N.sink.connect(N.out);N.sink.connect(N.verb);
 const layer=(pan)=>{const g=A.createGain(),f=A.createBiquadFilter(),p=A.createStereoPanner();f.type='lowpass';f.frequency.value=18000;g.connect(f);f.connect(p);p.connect(N.bus);return{g,f,p};};
 N.L={base:layer(),liq:layer(),gar:layer()};
 // 베이스: 브라운 50 + 핑크 50
 const brown=buf(4,(d,sr,n)=>{let l=0;for(let i=0;i<n;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l;}}),pink=buf(4,(d,sr,n)=>pinkF(d,n));
 const bg=A.createGain();bg.gain.value=.42;bg.connect(N.L.base.g);loop(brown,bg);const pg=A.createGain();pg.gain.value=.36;pg.connect(N.L.base.g);loop(pink,pg);
 // 리큐르: 파도(숨) + 시계(박자)
 const waves=buf(16,(d,sr,n)=>{let l=0;for(let i=0;i<n;i++){const t=i/sr,w=Math.random()*2-1;l=(l+.02*w)/1.02;const ph=(t%8)/8;d[i]=(l*3+w*.08)*(.12+.88*Math.pow(Math.max(0,Math.sin(Math.PI*ph)),1.8));}});
 const clock=buf(8,(d,sr,n)=>{for(let k=0;k<16;k++){const st=Math.round(k*.5*sr),f=k%2?1800:2600;for(let j=0;j<sr*.06&&st+j<n;j++){const t=j/sr;d[st+j]+=(Math.sin(2*Math.PI*f*t)*.6+(Math.random()*2-1)*.5)*Math.exp(-t*90);}}},.08);
 const wg=A.createGain();wg.gain.value=.9;wg.connect(N.L.liq.g);loop(waves,wg);const cg=A.createGain();cg.gain.value=.55;cg.connect(N.L.liq.g);loop(clock,cg);
 // 출렁임 쏴아 (밴드 노이즈)
 const wn=buf(3,(d,sr,n)=>{for(let i=0;i<n;i++)d[i]=Math.random()*2-1;});N.sw=A.createGain();N.sw.gain.value=0;N.swF=A.createBiquadFilter();N.swF.type='bandpass';N.swF.frequency.value=900;N.swF.Q.value=.8;
 const s=loop(wn,N.swF);N.swF.connect(N.sw);N.sw.connect(N.bus);
 gTimer();}
function ping(v=1,f=1568){if(!AC)return;const t=AC.currentTime+.01;[1,2.76].forEach((m,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f*m;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.16*v/(i+1),t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+.9-i*.3);o.connect(g);g.connect(N.L.gar.g);o.start(t);o.stop(t+1);});}
function gTimer(){let k=0;setInterval(()=>{if(AC&&AC.state==='running'){ping(.9,[1318,1568,1760,2093][k++%4]);}},1600);}
$('play').onclick=async()=>{if(!AC)start();if(AC.state==='running'){await AC.suspend();$('play').textContent='▶ 소리 켜기';}else{await AC.resume();$('play').textContent='❚❚ 소리 끄기';}
 if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function'){try{await DeviceOrientationEvent.requestPermission();}catch(_){}}};
$('shake').onclick=()=>{sloshV+=2.2*(Math.random()<.5?-1:1);slosh=Math.max(slosh,.9);};
// ── 기울기 입력: 끌기 · 슬라이더 · 폰 기울기
const st=$('stage');let drag=null;
st.addEventListener('pointerdown',e=>{st.setPointerCapture(e.pointerId);drag={x:e.clientX,t:tTarget};});
st.addEventListener('pointermove',e=>{if(!drag)return;tTarget=Math.max(-60,Math.min(60,drag.t+(e.clientX-drag.x)*.35));$('tilt').value=Math.round(tTarget);});
st.addEventListener('pointerup',()=>drag=null);
$('tilt').oninput=e=>tTarget=+e.target.value;
addEventListener('deviceorientation',e=>{if(e.gamma==null)return;tTarget=Math.max(-60,Math.min(60,e.gamma));$('tilt').value=Math.round(tTarget);});
let lastAcc=0;addEventListener('devicemotion',e=>{const a=e.accelerationIncludingGravity;if(!a)return;const m=Math.hypot(a.x||0,a.y||0,a.z||0);const d=Math.abs(m-lastAcc);lastAcc=m;if(d>6){sloshV+=d*.08*(Math.random()<.5?-1:1);slosh=Math.min(1.4,slosh+d*.05);}});
// ── 매 프레임: 기울기 → 소리
const set=(p,v,tc=.06)=>p.setTargetAtTime(v,AC.currentTime,tc);
let lastWall=0,txt='';
function audio(dt){if(!AC)return;const g=GL[glass],t=tilt/60,a=Math.abs(t),L=N.L;
 if(mode==='old'){ // 지금 방식: 좌우 + 고/저음 셸프만
  ['base','liq','gar'].forEach(k=>{set(L[k].g.gain,1);set(L[k].f.frequency,18000);set(L[k].p.pan,t*.8);});
  set(N.hs.gain,t*6);set(N.ls.gain,-t*6);set(N.rim.gain,0);set(N.sink.frequency,18000);set(N.vWet.gain,.06);set(N.warm.gain,0);set(N.sw.gain,0);
  txt='<b>지금 방식</b> · 기울인 쪽으로 소리가 옮겨 가고 고음/저음만 살짝 바뀌어요.';return;}
 set(N.hs.gain,0);set(N.ls.gain,0);
 // 잔이 정하는 반응: need = 반응 시작 기울기, curve = 반응 곡선
 const r=Math.pow(Math.max(0,(a-g.need*.35)/(1-g.need*.35)),g.curve)*Math.sign(t);   // −1..1
 // ① 층: 왼쪽 = 바닥의 베이스가 앞으로, 오른쪽 = 위쪽의 리큐르·가니쉬가 떠오름
 if(E('eLayer')){const down=Math.max(0,-r),up=Math.max(0,r);
  set(L.base.g.gain,1+.9*down-.75*up);set(L.base.f.frequency,18000*Math.pow(.06,up));
  set(L.liq.g.gain,1+.8*up-.7*down);set(L.liq.f.frequency,18000*Math.pow(.08,down));
  set(L.gar.g.gain,1+1.2*up-.8*down);set(L.gar.f.frequency,18000*Math.pow(.1,down));
  set(L.base.p.pan,-r*g.width*.9);set(L.liq.p.pan,r*g.width*.6);set(L.gar.p.pan,r*g.width);}
 else ['base','liq','gar'].forEach(k=>{set(L[k].g.gain,1);set(L[k].f.frequency,18000);set(L[k].p.pan,r*g.width*.8);});
 // ② 잠김: 많이 기울일수록 먹먹하게 (잔마다 세기)
 const deep=Math.max(0,(a-.55)/.45)*g.sink;set(N.sink.frequency,E('eSink')?18000*Math.pow(.025,deep):18000,.08);set(N.sink.Q.value!==undefined?N.sink.Q:N.sink.Q,E('eSink')?.7+deep*5:.7);
 // ③ 림 공명: 기울기 따라 음높이가 미끄러짐
 set(N.rim.frequency,g.f0*Math.pow(2,r*g.oct));set(N.rim.Q,g.q);set(N.rim.gain,E('eRim')?6+8*Math.min(1,a*1.4):0);
 // 모으는 잔: 오래 들고 있으면 따뜻해짐
 held=g.warm?Math.min(1,held+dt*(a>.1?.06:-.12)):0;set(N.warm.gain,held*9,.3);
 // 잔향 = 잔 몸통
 set(N.vWet.gain,g.verb+deep*.25);
 // ④ 출렁임
 set(N.sw.gain,E('eSlosh')?Math.min(.9,slosh*.55)*g.slosh:0,.03);set(N.swF.frequency,500+slosh*1600+r*400);
 txt=`<b>${g.n}</b> · `+(a<.08?'잔을 세우면 모든 재료가 고르게 들려요.':r<-.05?`왼쪽 → 바닥의 <b>베이스</b>가 앞으로, 리큐르는 멀어져요.`:r>.05?`오른쪽 → 위쪽의 <b>리큐르·가니쉬</b>가 떠올라요.`:`이 잔은 더 기울여야 반응해요.`)+(deep>.05&&E('eSink')?' 잔 속으로 잠겨 먹먹해져요.':'')+(held>.3?' 손 온도로 따뜻해지는 중.':'')+(slosh>.2&&E('eSlosh')?' 출렁!':'');}
// ── 그림: 잔이 기울고 액체 면은 수평 유지, 재료는 층으로
const cv=$('cv'),cx=cv.getContext('2d');
function fit(){const r=cv.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);cv.width=r.width*d;cv.height=r.height*d;cx.setTransform(d,0,0,d,0,0);}addEventListener('resize',fit);fit();
function glassPath(k,s){const p=new Path2D();
 if(k==='flute'){p.moveTo(-34*s,-170*s);p.bezierCurveTo(-38*s,-40*s,-30*s,60*s,0,92*s);p.bezierCurveTo(30*s,60*s,38*s,-40*s,34*s,-170*s);p.closePath();}
 else if(k==='snifter'){p.moveTo(-46*s,-120*s);p.bezierCurveTo(-120*s,-60*s,-120*s,80*s,0,92*s);p.bezierCurveTo(120*s,80*s,120*s,-60*s,46*s,-120*s);p.closePath();}
 else if(k==='rocks'){p.moveTo(-95*s,-70*s);p.lineTo(-84*s,92*s);p.lineTo(84*s,92*s);p.lineTo(95*s,-70*s);p.closePath();}
 else{p.moveTo(-70*s,-140*s);p.bezierCurveTo(-110*s,-40*s,-100*s,70*s,0,92*s);p.bezierCurveTo(100*s,70*s,110*s,-40*s,70*s,-140*s);p.closePath();}
 return p;}
let T=0;
function draw(dt){T+=dt;const r=cv.getBoundingClientRect(),W=r.width,H=r.height;cx.clearRect(0,0,W,H);const s=Math.min(W,H)/360,g=GL[glass];
 const cxp=W/2,cyp=H*.54,ang=tilt*Math.PI/180;const gp=glassPath(g.shape,s);
 cx.save();cx.translate(cxp,cyp);cx.rotate(ang);
 // 잔 안쪽을 클립 → 세계 좌표의 수평 층을 그림
 cx.save();cx.clip(gp);cx.rotate(-ang);
 const lvl=-10*s,wob=Math.sin(T*6)*slosh*22*s,tiltY=x=>lvl+x*Math.sin(T*3+1)*slosh*.12+wob*(x/(120*s));
 const band=(y0,y1,col,a)=>{cx.beginPath();cx.moveTo(-200*s,y0);for(let x=-200*s;x<=200*s;x+=8)cx.lineTo(x,y0+tiltY(x)-lvl);cx.lineTo(200*s,y1);cx.lineTo(-200*s,y1);cx.closePath();cx.fillStyle=col;cx.globalAlpha=a;cx.fill();cx.globalAlpha=1;};
 const L=Math.max(0,-tilt/60),U=Math.max(0,tilt/60);
 band(lvl,lvl+60*s,`rgba(120,190,255,${.55+.35*U})`,1);         // 위: 리큐르
 band(lvl+40*s,lvl+300*s,`rgba(240,110,70,${.6+.35*L})`,1);       // 아래: 베이스 (브라운+핑크)
